<style>
:root{
  --bg:#f3efe7; --card:#ffffff; --ink:#2a2b2e; --muted:#77726a; --line:#e3ded4; --accent:#2f4d6b;
  --winter:#3d5f86; --spring:#b0567a; --summer:#c08a17; --autumn:#b4532a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);
  padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h1{font:400 clamp(30px,4vw,42px)/1.05 var(--serif);margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.overall{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
section{margin-top:30px}
h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font:400 22px/1.2 var(--serif)}
h2 span{font:13px var(--sans);font-variant:all-small-caps;letter-spacing:.09em;color:var(--muted)}
h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(60,50,30,.06),0 8px 24px rgba(60,50,30,.08);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,50,30,.08),0 14px 32px rgba(60,50,30,.12)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{position:relative;aspect-ratio:126/81;max-width:100%;background:#fff;border-bottom:1px solid var(--line);
  background-image:radial-gradient(circle,#e4dfd6 .9px,transparent 1.2px);background-size:6px 6px}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.swatches{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.swatches .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:86%;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.88)}
.swatches .row i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatches .go{font-size:13px;font-weight:600;color:var(--c);background:rgba(255,255,255,.88);padding:2px 10px;border-radius:999px}
.card:hover .swatches .go{text-decoration:underline}
.thumb .badge{position:absolute;left:10px;top:10px;font-size:12px;font-variant:all-small-caps;letter-spacing:.08em;background:rgba(255,255,255,.9);
  border-radius:999px;padding:1px 10px 3px;color:var(--c)}
.meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta h3{margin:0;font:400 18px/1.2 var(--serif);text-wrap:balance}
.prog{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--c)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
.site{display:inline-flex;align-items:center;min-height:44px;margin:-14px 0 4px;font-size:13px;color:var(--muted);text-decoration:none}
.site:hover,footer a:hover{color:var(--ink);text-decoration:underline}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="site" href="https://vikasgoyal.github.io/">← vikasgoyal.github.io</a>
      <h1>Seasons Dot Art</h1>
      <p class="lede">Ten color-by-dot pictures through the year. Pick a page, choose a color, and tap or drag across its dots. Your progress stays in this browser.</p>

  <main id="gallery"></main>
  <footer><a href="https://vikasgoyal.github.io/">vikasgoyal.github.io</a> · Free to use</footer>
</div>
<script>
const PAGES = [{"file":"seasons-01-fireside-evening.html","id":"seasons-01-fireside-evening","title":"Fireside Evening","no":1,"season":"Winter","cols":126,"rows":81,"hex":["#1F5A5E","#5E2A22","#D33B2C","#EC8B34","#F8D54A","#F7C9A0","#C99A35","#B7A2D8","#A3CDEA","#FBF8F1"]},{"file":"seasons-02-snowy-cabin.html","id":"seasons-02-snowy-cabin","title":"Snowy Cabin at Night","no":2,"season":"Winter","cols":126,"rows":81,"hex":["#18203B","#33437A","#F7D96B","#F2E8C9","#FBFCFF","#A3B7D2","#8A5531","#3B2417","#2E6B4B","#D9443A"]},{"file":"seasons-03-cherry-blossom.html","id":"seasons-03-cherry-blossom","title":"Cherry Blossom Branch with Birds","no":3,"season":"Spring","cols":126,"rows":81,"hex":["#C9DEF0","#E4EFF8","#F7BFD2","#E2779E","#FFFFFF","#7B4F35","#3D261C","#6E86A8","#F0924A","#86B567"]},{"file":"seasons-04-tulip-windmill.html","id":"seasons-04-tulip-windmill","title":"Tulip Field and Windmill","no":4,"season":"Spring","cols":126,"rows":81,"hex":["#9FCDEE","#CFE7F7","#FFFFFF","#DE3E36","#F5C531","#F28DB4","#3F8E45","#A6CF6B","#8E5A3B","#35281F"]},{"file":"seasons-05-rainy-window.html","id":"seasons-05-rainy-window","title":"Rainy Window with Potted Herbs","no":5,"season":"Spring","cols":126,"rows":81,"hex":["#3A302C","#FAF7F0","#EBD8A4","#8EA2B5","#6F8499","#D7E4EF","#C4663B","#3F7D3A","#94C25C","#A784C7"]},{"file":"seasons-06-beach-umbrella.html","id":"seasons-06-beach-umbrella","title":"Beach Umbrella and Waves","no":6,"season":"Summer","cols":126,"rows":81,"hex":["#24324A","#DE4A3C","#FBF9F3","#F6C945","#2F7FC1","#B9E0F4","#2FB3AC","#9EE2D9","#F0D7A4","#D8B477"]},{"file":"seasons-07-watermelon-picnic.html","id":"seasons-07-watermelon-picnic","title":"Watermelon Picnic","no":7,"season":"Summer","cols":126,"rows":81,"hex":["#7DB04B","#5A8E35","#4F86C9","#FBF8F1","#E8464F","#CFE8A0","#2E7A3A","#F6D54E","#1F2B1C"]},{"file":"seasons-08-sunflowers.html","id":"seasons-08-sunflowers","title":"Sunflowers at Golden Hour","no":8,"season":"Summer","cols":126,"rows":81,"hex":["#FBE6AE","#F5B65A","#EC8A62","#FFD323","#E8861C","#6B3D1C","#5E9A33","#2F5E22","#2B1A0E"]},{"file":"seasons-09-pumpkin-patch.html","id":"seasons-09-pumpkin-patch","title":"Pumpkin Patch with Crates","no":9,"season":"Autumn","cols":126,"rows":81,"hex":["#3A2416","#E8842C","#B4501E","#EDBB3A","#D7AE6E","#7E512E","#5E9442","#2F5428","#F6E7C8","#F3CDA6"]},{"file":"seasons-10-maple-tea.html","id":"seasons-10-maple-tea","title":"Maple Leaves and a Cup of Tea","no":10,"season":"Autumn","cols":126,"rows":81,"hex":["#3B2A22","#FBF4E4","#A85F2C","#C63D2F","#EA8A2F","#EBBE3E","#93AA7C","#6A8659","#6F8E95","#56757D"]}];
const SEASONS = [['Winter','--winter'],['Spring','--spring'],['Summer','--summer'],['Autumn','--autumn']];
function readProgress(pg){
  try{
    const o = JSON.parse(localStorage.getItem('dotart:'+pg.id) || 'null');
    if(!o || o.k !== pg.hex.length || typeof o.f !== 'string' || o.f.length !== pg.cols*pg.rows) return null;
    return o.f;
  }catch(e){ return null; }
}
function drawThumb(cv, pg, f){
  const S=2, g=cv.getContext('2d'); cv.width=pg.cols*S; cv.height=pg.rows*S; g.clearRect(0,0,cv.width,cv.height);
  if(!f) return 0;
  let n=0;
  for(let i=0;i<f.length;i++){ const ch=f.charCodeAt(i); if(ch===46) continue; const k=ch-97; if(k<0||k>=pg.hex.length) continue;
    n++; g.fillStyle=pg.hex[k]; g.fillRect((i%pg.cols)*S, Math.floor(i/pg.cols)*S, S, S); }
  return n;
}
function render(){
  const root=document.getElementById('gallery'); root.textContent='';
  let done=0, total=0;
  for(const [season, colorVar] of SEASONS){
    const list=PAGES.filter(p=>p.season===season); if(!list.length) continue;
    const sec=document.createElement('section'); sec.style.setProperty('--c', 'var('+colorVar+')');
    const h=document.createElement('h2'); h.textContent=season;
    const sub=document.createElement('span'); sub.textContent=list.length+(list.length===1?' page':' pages'); h.appendChild(sub); sec.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid'; sec.appendChild(grid);
    for(const pg of list){
      const a=document.createElement('a'); a.className='card'; a.href=pg.file;
      const thumb=document.createElement('div'); thumb.className='thumb';
      const cv=document.createElement('canvas'); cv.setAttribute('aria-hidden','true'); thumb.appendChild(cv);
      const badge=document.createElement('span'); badge.className='badge'; badge.textContent='No. '+String(pg.no).padStart(2,'0')+' · '+season; thumb.appendChild(badge);
      const painted=drawThumb(cv, pg, readProgress(pg)), N=pg.cols*pg.rows, pct=Math.floor(100*painted/N);
      if(!painted){                     // not started: show the palette (no hint of the picture) and a Start label
        const sw=document.createElement('div'); sw.className='swatches'; sw.setAttribute('aria-hidden','true');
        const row=document.createElement('div'); row.className='row';
        for(const h of pg.hex){ const d=document.createElement('i'); d.style.background=h; row.appendChild(d); }
        const go=document.createElement('span'); go.className='go'; go.textContent='Start →';
        sw.append(row, go); thumb.appendChild(sw);
      }
      done+=painted; total+=N;
      const meta=document.createElement('div'); meta.className='meta';
      const h3=document.createElement('h3'); h3.textContent=pg.title; meta.appendChild(h3);
      const prog=document.createElement('div'); prog.className='prog';
      const tr=document.createElement('div'); tr.className='track'; const bar=document.createElement('i'); bar.style.width=(100*painted/N)+'%'; tr.appendChild(bar);
      const lab=document.createElement('span'); lab.textContent= painted===N ? 'Complete ✓' : painted ? (pct||'<1')+'%' : 'Not started';
      prog.append(tr, lab); meta.appendChild(prog);
      a.setAttribute('aria-label', pg.title+', No. '+pg.no+', '+season+', '+(painted===N?'complete':painted?pct+' percent colored':'not started'));
      a.append(thumb, meta); grid.appendChild(a);
    }
    root.appendChild(sec);
  }
  document.getElementById('overall').textContent = done ? (Math.floor(100*done/total)||'<1')+'% of the series colored' : PAGES.length+' pages · '+(total).toLocaleString('en-US')+' dots';
}
render();
window.addEventListener('pageshow', render);          // refresh after coming back from a page
window.addEventListener('storage', render);
</script>
