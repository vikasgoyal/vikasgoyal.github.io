=====================================================================================
  SEASONS DOT ART — HOW TO MAKE A NEW PAGE
=====================================================================================
  1. Copy this file to seasons-NN-some-name.html.
  2. Replace ONLY the `PAGE = (function(){ ... })()` block (and the <title> / meta
     description in <head>). Everything after "ENGINE (generic)" stays untouched.
  3. Check the result by opening the page with #preview at the end of the URL (for example
     seasons-03-cherry-blossom.html#preview): the finished view at full size, nothing saved.
     This is for authors only; nothing on the page links to it.

  PAGE fields
    id              unique id, e.g. 'seasons-02-snowy-cabin' (also the progress storage key)
    title           e.g. 'Snowy Cabin at Night' (top bar)
    series          'Seasons Dot Art · No. NN / 10' (small caps under the title)
    completeMessage text on the completion card, e.g. 'Snowy Cabin at Night — complete.'
    about           text for the About dialog
    prev / next     optional { href, title } — shown as links in the ⋯ menu
    cols, rows      126 x 81 (landscape). Sketch in 84 x 54 "design units" and scale by
                    K = 1.5 with the helpers below, so line widths and outlines stay 1 dot.
    palette         9–10 colours: { LETTER: { name, hex } }. One unique capital letter per
                    colour (avoid I and O). The key order is the order in the palette rail.
    fallback        code for any cell no layer covers (normally the background colour)
    layers          bottom -> top. Each cell takes the code of the TOPMOST layer whose shape
                    contains the cell centre and whose fill returns a code.

  Helpers defined at the top of PAGE (design units, scaled by K):
    R(x,y,w,h)  rect · E(cx,cy,rx,ry)  ellipse · P(pts)  polygon · U(...)  union
    L(lines,w)  thick polylines (w in grid cells) · grow(shape,d)  enlarge by d cells
    outlined(shape, fill)  -> [1-dot dark outline layer, fill layer]

  Shapes (grid units when written by hand):
    rect {x,y,w,h} · ellipse {cx,cy,rx,ry} · poly {pts:[[x,y]...]}
    blob {circles:[[cx,cy,r,ry?]...]} · lines {lines:[[[x,y]...]...], w}
    ridge {base, waves:[[amp,freq,phase]...], bottom}  (filled below a wavy line)
    union {shapes:[...]}
  Fills:
    'T'                                              a single colour
    {type:'checker', codes:[a,b], period}            diagonal checker of period x period cells
    {type:'waves', codes:[a,b], amp, period, wavelength}   wavy horizontal bands
    {type:'stripes', code, slope, period, width, dash, gap} streaks (null in the gaps, so
                                                     the layer below shows through)
    (linear / mix gradients still exist in the engine, but this series does not use them)

  Style rules for the series
    - FLAT shapes only: no gradients or dithered shading.
    - A 1-dot dark outline wherever an object meets a similar colour (use outlined()).
    - Backgrounds are patterns (checker / waves), never empty and never a gradient:
      every dot belongs to the picture.
    - One clear focal object in the centre; supporting objects left and right.
    - Every object must be recognizable in the finished view at full size, not just as
      a thumbnail. Small details below ~2 dots wide disappear: make them bigger or drop them.
    - Check the palette counts: a colour used by only a handful of dots is not worth a slot.

<style>
:root{
  --bg:#f3efe7; --card:#ffffff; --ink:#2a2b2e; --muted:#77726a; --line:#e3ded4; --accent:#2f4d6b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}   /* no swipe-back navigation while painting */
body{background:var(--bg);color:var(--ink);font:15px/1.3 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 124px;grid-template-rows:56px minmax(0,1fr);column-gap:12px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

/* top bar: buttons left, title centred, progress right */

.ttl{text-align:center;min-width:0}
h1{font:400 22px/1.05 var(--serif);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series{display:block;margin-top:2px;font-size:13px;font-variant:all-small-caps;letter-spacing:.09em;color:var(--muted);white-space:nowrap}
.prog{justify-self:end;display:flex;align-items:center;gap:8px;width:min(260px,100%)}
.track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.btns{justify-self:start;display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ib.home{width:auto;display:flex;gap:7px;padding:0 13px 0 11px;color:inherit;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
@media (max-width:1000px){.ib.home span{display:none}.ib.home{width:44px;padding:0;justify-content:center}}

/* canvas card */
.stage{grid-column:1;grid-row:2;position:relative;background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(60,50,30,.06),0 10px 30px rgba(60,50,30,.10)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* palette rail */
.rail{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:2px 3px;scrollbar-width:thin}
.sw{min-height:48px;flex:none;display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  cursor:pointer;text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sw i{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}

.sw small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.sw.done{opacity:.45}
/* zoom pill, first-visit tip */
.zoom{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:2px;padding:4px;border-radius:14px;

.zpct{min-width:50px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;right:12px;bottom:72px;z-index:4;max-width:290px;display:flex;align-items:center;gap:4px;padding:6px 4px 6px 14px;border-radius:12px;

.tip::after{content:"";position:absolute;right:96px;bottom:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.tip button{flex:none;min-width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:20px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mini-wrap{position:absolute;left:12px;bottom:12px;z-index:3;padding:5px;border-radius:10px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 4px 16px rgba(40,30,20,.16)}
#mini{position:static;display:block;width:160px;height:auto;border-radius:6px;opacity:.92;cursor:pointer}
.mini-hide{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font:600 15px/1 var(--sans);color:var(--muted);touch-action:manipulation}
.mini-hide::before{content:"";position:absolute;inset:-9px}          /* 44px touch target */
.mini-show{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(255,255,255,.85)}

/* menu, dialogs, completion */
.menu{position:fixed;left:12px;top:58px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;
  box-shadow:0 12px 32px rgba(40,30,20,.18);display:flex;flex-direction:column}
.mi{min-height:44px;border:0;background:none;text-align:left;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mi:hover{background:var(--bg)}
a.mi{color:inherit;text-decoration:none}
.mi.site{margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 8px 8px;color:var(--muted,inherit)}
.mi .tog{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none}
.mi .tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s}
.mi[aria-checked="true"] .tog{background:var(--accent)}
.mi[aria-checked="true"] .tog::after{left:16px}
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(40,35,28,.28);padding:16px}
.dlg{background:var(--card);border-radius:14px;padding:20px;max-width:360px;box-shadow:0 16px 40px rgba(40,30,20,.25)}
.dlg h2{font:400 20px var(--serif);margin:0 0 8px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.done-msg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:14px;
  padding:10px 10px 10px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(40,30,20,.16);animation:rise .6s ease}
.done-msg p{margin:0;font:italic 20px var(--serif)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ===================== PAGE (the only page-specific part) ===================== */
const PAGE = (function(){
  /* Pumpkin Patch with Crates. Sketched in design units (84 x 54), scaled by K onto 126 x 81.
     Line widths and outline growth are in grid cells, so outlines stay 1 dot. */
  const K = 1.5;
  const R = (x,y,w,h) => ({type:'rect', x:x*K, y:y*K, w:w*K, h:h*K});
  const E = (cx,cy,rx,ry) => ({type:'ellipse', cx:cx*K, cy:cy*K, rx:rx*K, ry:(ry==null?rx:ry)*K});
  const U = (...shapes) => ({type:'union', shapes});
  const P = pts => ({type:'poly', pts:pts.map(([x,y]) => [x*K, y*K])});
  const L = (lines, w) => ({type:'lines', w, lines:lines.map(l => l.map(([x,y]) => [x*K, y*K]))});
  const grow = (s,d) => s.type==='rect' ? {...s, x:s.x-d, y:s.y-d, w:s.w+2*d, h:s.h+2*d}
                    : s.type==='ellipse' ? {...s, rx:s.rx+d, ry:s.ry+d}
                    : s.type==='union' ? U(...s.shapes.map(t => grow(t,d)))
                    : s.type==='lines' ? {...s, w:s.w+d} : s;
  const outlined = (shape, fill, d=1) => [{shape:grow(shape,d), fill:'K'}, {shape, fill}];
  const cell = (c,r,w=1,h=1) => ({type:'rect', x:c, y:r, w, h});

  // Maple-style leaf: five pointed lobes around a centre, outlined, with a stem.
  function leaf(cx, cy, r, rot, code){
    const lobes=[[-150,.85],[-90,1],[-30,.85],[30,.55],[150,.55]], pts=[];
    const at=(a,rad)=>{ const t=(a+rot)*Math.PI/180; return [cx+Math.cos(t)*r*rad, cy+Math.sin(t)*r*rad]; };
    lobes.forEach(([a,len],i)=>{ const next=lobes[(i+1)%lobes.length][0]+(i===lobes.length-1?360:0);
      pts.push(at(a-14,len*.62), at(a,len), at(a+14,len*.62), at((a+next)/2, i===3?.22:.34)); });
    const stem=L([[at(90,.2),at(90,1.05)]], .5);
    return [{shape:stem, fill:'K'}, ...outlined(P(pts), code, .9)];
  }
  // Pumpkin: five overlapping lobes (outer lobes drawn first), rust rib lines between lobes, green stem.
  function pumpkin(cx, cy, rx, ry, curl){
    const lobes=[-1,-.5,0,.5,1].map(t => ({t, e:E(cx+t*rx*.62, cy, rx*.42, ry*(1-.1*Math.abs(t)))}));
    const out=[{shape:grow(U(...lobes.map(l=>l.e)),1.6), fill:'K'}];   // outline stays visible outside the rust rib edge
    lobes.sort((a,b)=>Math.abs(b.t)-Math.abs(a.t)).forEach(l => { out.push({shape:grow(l.e,.9), fill:'R'}); out.push({shape:l.e, fill:'A'}); });
    const stem=P([[cx-1.1,cy-ry+.8],[cx+1.1,cy-ry+.8],[cx+1.9,cy-ry-2.4],[cx+.3,cy-ry-2.9]]);
    out.push(...outlined(stem,'G',.8));
    if(curl) out.push({shape:L([[[cx+1.6,cy-ry-1.6],[cx+3.4,cy-ry-2.8],[cx+4.6,cy-ry-1.6],[cx+3.6,cy-ry-.6]]], .5), fill:'G'});
    return out;
  }
  // Wooden crate: tan planks with dark seams, brown corner posts, nail dots.
  function crate(x,y,w,h){
    const out=[{shape:R(x-.7,y-.7,w+1.4,h+1.4), fill:'K'}, {shape:R(x,y,w,h), fill:'W'}];
    const seams=[]; for(let k=1;k<3;k++) seams.push([[x,y+h*k/3],[x+w,y+h*k/3]]);
    out.push({shape:L(seams,.5), fill:'K'});
    out.push(...[x, x+w-2.4].flatMap(px => outlined(R(px,y,2.4,h),'B',.5)));
    const nails=[]; [x+1.2, x+w-1.2].forEach(px => [y+1.3, y+h/2, y+h-1.3].forEach(py => nails.push(E(px,py,.35))));
    out.push({shape:U(...nails), fill:'K'});
    return out;
  }
  // Big three-lobed pumpkin leaf with a vein.
  function bigLeaf(cx, cy, s, flip){
    const f=flip?-1:1, shape=U(E(cx,cy,3.2*s,2.3*s), E(cx-2.4*s*f,cy-1.4*s,2.2*s,1.7*s), E(cx+2.2*s*f,cy-1.6*s,2*s,1.6*s));
    return [...outlined(shape,'G',.9), {shape:L([[[cx-2.6*s*f,cy+.6*s],[cx+2.4*s*f,cy-1.2*s]]],.45), fill:'D'}];
  }

  const horizon = 20;
  // Vine curls (design units): a wavy runner with a small loop every few units, plus little leaves.
  const vines=[], vineLeaves=[];
  const vine=(x0,y0,len,ph)=>{ const run=[]; for(let t=0;t<=len;t+=.25) run.push([x0+t, y0+.7*Math.sin(t*.8+ph)]); vines.push(run);
    for(let t=2;t<len-1;t+=5){ const cx=x0+t, cy=y0+.7*Math.sin(t*.8+ph)-1.1, loop=[]; for(let a=0;a<=7;a+=.35) loop.push([cx+.9*Math.cos(a)*(1-a/9), cy+.9*Math.sin(a)*(1-a/9)]); vines.push(loop);
      vineLeaves.push(E(cx+2.2, y0+.7*Math.sin((t+2.2)*.8+ph)+.6, .9, .6)); } };
  vine(26,26.4,34,0); vine(61,23.4,12,1.3); vine(77.5,34,6.5,2.6); vine(1,52.2,30,2.1); vine(52,52.6,32,.4);
  return {
    id: 'seasons-09-pumpkin-patch',
    title: 'Pumpkin Patch with Crates',
    series: 'Seasons Dot Art · No. 09 / 10',
    completeMessage: 'Pumpkin Patch with Crates — complete. Harvest is in.',
    about: 'Seasons Dot Art, No. 09 of 10 (autumn). Pick a color on the right, then tap or drag across its dots. Two fingers pan and zoom; the map in the corner jumps around the picture. Free from vikasgoyal.github.io.',
    prev: { href: 'seasons-08-sunflowers.html', title: 'Sunflowers at Golden Hour' },
    next: { href: 'seasons-10-maple-tea.html', title: 'Maple Leaves and a Cup of Tea' },
    cols: 126, rows: 81,
    palette: {
      K:{name:'dark brown',   hex:'#3A2416'},
      A:{name:'pumpkin',      hex:'#E8842C'},
      R:{name:'rust',         hex:'#B4501E'},
      Y:{name:'gold',         hex:'#EDBB3A'},
      W:{name:'crate tan',    hex:'#D7AE6E'},
      B:{name:'wood brown',   hex:'#7E512E'},
      G:{name:'leaf green',   hex:'#5E9442'},
      D:{name:'dark green',   hex:'#2F5428'},
      S:{name:'cream sky',    hex:'#F6E7C8'},
      P:{name:'peach sky',    hex:'#F3CDA6'}
    },
    fallback: 'S',
    layers: [
      // background: peach/cream sky checker with distant birds; soil rows with vine curls and grass tufts
      {bg:true, shape:R(0,0,84,horizon+3), fill:{type:'checker', codes:['S','P'], period:2}},
      {bg:true, shape:L([[[34,4],[35,5],[36,4]], [[39,6.5],[40,7.5],[41,6.5]], [[56,3],[57,4],[58,3]]], .45), fill:'K'},
      // soil rows: lighter brown furrows (tan / wood brown), gently wavy
      {bg:true, shape:{type:'ridge', base:horizon*K, waves:[[1.4,.06,.5],[.8,.17,2]], bottom:81}, fill:{type:'waves', codes:['W','B'], amp:.6, period:3, wavelength:22}},

function doUndo(){ const s=undo.pop(); if(!s) return; for(let j=s.length-1;j>=0;j--) setFill(s[j][0],s[j][1]); save(); updateUI(); }

/* ---------- pointers: one finger paints, two fingers pinch/pan ---------- */
const pts=new Map(); let pinch=null, lastTap={t:0,x:0,y:0}, downAt=null;
const local = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
cv.addEventListener('pointerdown', e => {
  if(e.pointerType==='mouse' && e.button!==0) return;
  cv.setPointerCapture(e.pointerId); closeMenu();
  const p=local(e); pts.set(e.pointerId,p);
  if(pts.size===2){ endStroke(); const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1, m:[(a[0]+b[0])/2,(a[1]+b[1])/2], s:view.s, tx:view.tx, ty:view.ty}; return; }
  if(pts.size>2 || complete || preview) return;
  stroke=[]; last=p; downAt={t:performance.now(),x:p[0],y:p[1]}; paintAt(p[0],p[1]);
});
cv.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  const p=local(e); pts.set(e.pointerId,p);
  if(pinch && pts.size===2){
    const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const ns=clamp(pinch.s*d/pinch.d,1,4), wx=(pinch.m[0]-pinch.tx)/pinch.s, wy=(pinch.m[1]-pinch.ty)/pinch.s;
    view.s=ns; view.tx=m[0]-wx*ns; view.ty=m[1]-wy*ns; clampView(); dirty=true; return;
  }
  if(stroke){ const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for(const ce of (ev.length?ev:[e])){ const q=local(ce); paintLine(last[0],last[1],q[0],q[1]); last=q; } }
});
function up(e){
  if(!pts.has(e.pointerId)) return;
  const p=pts.get(e.pointerId); pts.delete(e.pointerId);
  if(pinch){ if(pts.size<2) pinch=null; return; }
  const tap = downAt && performance.now()-downAt.t<300 && Math.hypot(p[0]-downAt.x,p[1]-downAt.y)<12;
  const painted = stroke && stroke.length>0;
  endStroke();
  if(tap && !painted){   // double-tap on an empty spot resets the view
    const now=performance.now();
    if(now-lastTap.t<350 && Math.hypot(p[0]-lastTap.x,p[1]-lastTap.y)<30){ view.s=1; clampView(); dirty=true; lastTap.t=0; }
    else lastTap={t:now,x:p[0],y:p[1]};
  }
  downAt=null;
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
// Minimap: tap or drag to move the view there (zooms to 2x first if the whole picture is showing).
let miniDrag=false;
const miniWrap=$('miniWrap'), miniShow=$('miniShow'); let miniCollapsed=false;
function updateMiniVis(){                    // no map when the whole picture is showing, or once it is finished
  const show = !complete && !preview && view.s>1.1;
  miniWrap.hidden = !show || miniCollapsed; miniShow.hidden = !show || !miniCollapsed;
}
onTap($('miniHide'), () => { miniCollapsed=true; updateMiniVis(); });
onTap(miniShow, () => { miniCollapsed=false; updateMiniVis(); dirty=true; });
function miniJump(e){ const r=mini.getBoundingClientRect(); if(view.s<1.5) view.s=2;
  centerOn(clamp((e.clientX-r.left)/r.width,0,1)*COLS, clamp((e.clientY-r.top)/r.height,0,1)*ROWS); }
mini.addEventListener('pointerdown', e => { mini.setPointerCapture(e.pointerId); miniDrag=true; closeMenu(); miniJump(e); });
mini.addEventListener('pointermove', e => { if(miniDrag) miniJump(e); });
['pointerup','pointercancel'].forEach(t => mini.addEventListener(t, () => { miniDrag=false; }));
mini.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [x,y]=local(e), k = e.deltaMode===1 ? 16 : 1;
  if(e.ctrlKey){ const ns=clamp(view.s*Math.exp(-e.deltaY*k*.01),1,4), wx=(x-view.tx)/view.s, wy=(y-view.ty)/view.s;
    view.s=ns; view.tx=x-wx*ns; view.ty=y-wy*ns; }
  else { view.tx-=e.deltaX*k; view.ty-=e.deltaY*k; }
  clampView(); dirty=true;
},{passive:false});

/* ---------- top bar buttons ---------- */
onTap($('bUndo'), () => { if(!$('bUndo').disabled) doUndo(); });
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); doUndo(); } });
// The All pages link: navigate on finger lift too, since Chrome drops the click right after a drag.
onTap(document.querySelector('.ib.home'), a => { location.href=a.href; });
const menu=$('menu'), bMenu=$('bMenu');
// Optional links to the neighbouring pages of the series (PAGE.prev / PAGE.next).
[['prev', t => '← '+t], ['next', t => t+' →']].forEach(([k, label]) => { if(!P[k]) return;
  const a=document.createElement('a'); a.className='mi'; a.setAttribute('role','menuitem'); a.href=P[k].href; a.textContent=label(P[k].title); menu.insertBefore(a, $('mHome')); });   // the site link stays last
function closeMenu(){ menu.hidden=true; bMenu.setAttribute('aria-expanded','false'); }
onTap(bMenu, ()=>{ const br=bMenu.getBoundingClientRect(); menu.style.left=br.left+'px'; menu.style.top=(br.bottom+6)+'px'; menu.hidden=!menu.hidden; bMenu.setAttribute('aria-expanded',String(!menu.hidden)); if(!menu.hidden) menu.firstElementChild.focus(); });
document.addEventListener('pointerdown', e => { if(!menu.hidden && !menu.contains(e.target) && !bMenu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeMenu(); });
function dialog(title, text, actions){
  closeMenu();
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT"></h2><p></p><div class="row"></div></div>`;
  v.querySelector('h2').textContent=title; v.querySelector('p').textContent=text;
  const close=()=>v.remove();
  actions.forEach(([label,cls,fn])=>{ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; onTap(b, ()=>{ close(); fn&&fn(); }); v.querySelector('.row').appendChild(b); });
  v.addEventListener('pointerdown',e=>{ if(e.target===v) close(); });
  v.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  document.body.appendChild(v); v.querySelector('.btn').focus();
}
function resetAll(){ if(preview) return; for(let i=0;i<N;i++) setFill(i,-1); undo.length=0; store.del(KEY); view.s=1; clampView(); select(firstOpen()); updateUI(); }
onTap($('mReset'), ()=>dialog('Reset this picture?', 'Every colored dot will be cleared. This can’t be undone.', [['Cancel','',null],['Reset','primary',resetAll]]));
onTap($('mAbout'), ()=>dialog(P.title, P.about, [['Close','primary',null]]));

/* ---------- zoom pill + first-visit tip ---------- */
const zPct=$('zPct'), zIn=$('zIn'), zOut=$('zOut'), tip=$('tip'), TIP_KEY='dotart:tip-zoom-seen';
const ZSTEP=Math.SQRT2;                       // 100 → 141 → 200 → 283 → 400 %
onTap(zIn,  () => glide(viewAt(view.s*ZSTEP, W/2, H/2)));
onTap(zOut, () => glide(viewAt(view.s/ZSTEP, W/2, H/2)));
onTap($('zFit'), () => glide({s:1, tx:0, ty:0}));
let lastPct=-1;
function updateZoomUI(){
  const pct=Math.round(view.s*100);
  if(pct!==lastPct){ lastPct=pct; zPct.textContent=pct+'%'; zOut.disabled=view.s<=1.001; zIn.disabled=view.s>=3.999; }
  $('zoom').hidden=complete||preview;                                   // nothing over the finished picture but the bottom card
  if(complete||preview) tip.hidden=true;
  if(!tip.hidden && view.s>1.05) dismissTip();
}
function dismissTip(){ tip.hidden=true; store.set(TIP_KEY,'1'); }
onTap($('tipX'), dismissTip);
if(!preview && !store.get(TIP_KEY)) tip.hidden=false;
onTap($('mHint'), () => { hint=!hint; $('mHint').setAttribute('aria-checked',String(hint)); uKey=''; dirty=true; });

/* ---------- completion ---------- */
let doneEl=null;
function showDone(){
  doneEl=document.createElement('div'); doneEl.className='done-msg'; doneEl.setAttribute('role','status');
  doneEl.innerHTML=`<p></p><button class="btn primary">Start over</button>`;
  doneEl.querySelector('p').textContent=P.completeMessage;
  onTap(doneEl.querySelector('button'), resetAll);
  stage.appendChild(doneEl);
}
function hideDone(){ if(doneEl){ doneEl.remove(); doneEl=null; } }

/* ---------- boot ---------- */
new ResizeObserver(layout).observe(stage);
if(preview){ revealing=true; revealAt=-Infinity; }      // finished view at once, at Fit
layout(); select(firstOpen()); updateUI();
requestAnimationFrame(frame);
// Read-only hooks for automated tests (no effect on the page).
window.__dotart = { id: P.id, get hint(){ return hint; }, answer, fills, CODES, COLS, ROWS, view, get cell(){ return cell0*view.s; }, get origin(){ return [ox,oy]; }, get sel(){ return sel; }, get undoDepth(){ return undo.length; } };
})();
</script>
</body>
</html>
