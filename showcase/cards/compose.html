<!doctype html>
<!-- Card art for the showcase index (showcase/index.html).
     Each card is a 1200x520 scene with its title built into the art.
     Open compose.html?c=<id> to view one; render all with headless Chrome, e.g.:
       chrome --headless=new --hide-scrollbars --window-size=1200,520 --virtual-time-budget=6000
              --screenshot=cards/dawn.jpg "file:///.../showcase/cards/compose.html?c=dawn"
     ids: meanwhile road dawn dots folded hello vedic -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Showcase card art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Overpass:wght@900&family=IM+Fell+English:ital@1&family=Fraunces:ital,opsz,wght@1,9..144,300&family=Marcellus&family=Nunito:wght@900&display=block">
<style>
html,body{margin:0;width:1200px;height:520px;overflow:hidden}
.card{position:relative;width:1200px;height:520px;overflow:hidden;display:none}
.card svg{position:absolute;inset:0}
/* Mother Road: words painted on the asphalt */
.paint{position:absolute;left:0;top:0;width:1200px;height:520px;perspective:300px;perspective-origin:600px 258px;overflow:hidden}
.paint div{position:absolute;left:615px;width:440px;bottom:-40px;height:900px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:150px;
  transform-origin:50% 100%;transform:rotateX(78deg);
  font:900 96px/1 Overpass,Arial Black,sans-serif;color:#f1ece0;letter-spacing:.03em;
  -webkit-mask-image:var(--wear);mask-image:var(--wear);-webkit-mask-size:160px;mask-size:160px;opacity:.9}
.paint div span{display:block;transform:scaleY(2.6);transform-origin:50% 100%}
</style></head>
<body>
<!-- DAWN LINE -->
<div class="card" id="dawn">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#bdb8de"/><stop offset=".55" stop-color="#ecdcd0"/><stop offset="1" stop-color="#ffc79a"/></linearGradient>
    <radialGradient id="halo" cx="1110" cy="640" r="560" gradientUnits="userSpaceOnUse"><stop offset=".66" stop-color="#ff8a5c" stop-opacity=".55"/><stop offset=".74" stop-color="#ff8a5c" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
    <radialGradient id="globe" cx="1210" cy="740" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0a0c26"/><stop offset=".72" stop-color="#151a44"/><stop offset=".9" stop-color="#3b2550"/><stop offset="1" stop-color="#ff9a66"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="520" fill="#05071a"/>
  <g id="stars" fill="#f4efe6"></g>
  <circle cx="1110" cy="640" r="560" fill="url(#halo)"/>
  <text x="64" y="330" font-family="Instrument Serif" font-style="italic" font-size="212" fill="url(#tx)" opacity=".35" filter="url(#soft)">Dawn Line</text>
  <text x="64" y="330" font-family="Instrument Serif" font-style="italic" font-size="212" fill="url(#tx)">Dawn Line</text>
  <circle cx="1110" cy="640" r="410" fill="url(#globe)"/>
  <path d="M745 452A410 410 0 0 1 1060 233" fill="none" stroke="#ffc58f" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity=".9"/>
</svg>
</div>

<!-- MOTHER ROAD -->
<div class="card" id="road">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c82c0"/><stop offset=".75" stop-color="#e9c08f"/><stop offset="1" stop-color="#f3cf9c"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98350"/><stop offset="1" stop-color="#b8693b"/></linearGradient>
    <linearGradient id="asph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a6466"/><stop offset="1" stop-color="#3d3a3d"/></linearGradient>
    <radialGradient id="sunG" cx="880" cy="150" r="150" gradientUnits="userSpaceOnUse"><stop offset=".3" stop-color="#fff1d0" stop-opacity=".7"/><stop offset="1" stop-color="#fff1d0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#sky)"/>
  <circle cx="880" cy="150" r="150" fill="url(#sunG)"/><circle cx="880" cy="150" r="44" fill="#ffd9a2"/>
  <path d="M0 262V214h70l26-30h150l20 30h120l14-14h70l12 14h90V262Z" fill="#a8533a"/>
  <path d="M640 262v-34h110l30-40h170l24 40h226v34Z" fill="#b65d3f"/>
  <rect y="258" width="1200" height="262" fill="url(#ground)"/>
  <path d="M590 258h20L1210 520H-10Z" fill="url(#asph)"/>
  <path d="M590 258h20L1210 520H1150L607 258h-14L50 520H-10Z" fill="#efe6d4" opacity=".85"/>
  <path d="M598.5 258h3l14 262h-31Z" fill="#e7b43a"/>
  <path d="M603 258h1.4l26 262h-6Z" fill="#e7b43a" opacity="0"/>
</svg>
<div class="paint"><div><span>MOTHER</span><span>ROAD</span></div></div>
</div>

<!-- YES HELLO -->
<div class="card" id="hello">

  <defs><filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#243e32" flood-opacity=".16"/></filter></defs>
  <rect width="1200" height="520" fill="#f6f3df"/>
  <g font-family="'Trebuchet MS','Segoe UI',sans-serif" font-weight="700" fill="#243e32">
    <path d="M140 110h560a48 48 0 0 1 48 48v172a48 48 0 0 1-48 48H260l-74 64 14-64h-60a48 48 0 0 1-48-48V158a48 48 0 0 1 48-48Z" fill="#dce5b6" filter="url(#sh)"/>
    <text x="150" y="292" font-size="132" letter-spacing="-2">Yes Hello</text>
    <g filter="url(#sh)"><path d="M700 40h220a32 32 0 0 1 32 32v58a32 32 0 0 1-32 32h-40l8 36-46-36H700a32 32 0 0 1-32-32V72a32 32 0 0 1 32-32Z" fill="#ded3ee"/></g>
    <text x="712" y="124" font-size="56">Hola</text>
    <g filter="url(#sh)"><path d="M736 300h340a34 34 0 0 1 34 34v70a34 34 0 0 1-34 34H840l-48 40 8-40h-64a34 34 0 0 1-34-34v-70a34 34 0 0 1 34-34Z" fill="#efbe48"/></g>
    <text x="760" y="394" font-size="64">Namaste</text>
    <g filter="url(#sh)"><path d="M904 176h210a28 28 0 0 1 28 28v44a28 28 0 0 1-28 28H904a28 28 0 0 1-28-28v-44a28 28 0 0 1 28-28Z" fill="#fffef7" stroke="#c7cbb5" stroke-width="2"/></g>
    <text x="900" y="242" font-size="48" dx="10">Bonjour</text>
  </g>
</svg>
</div>

<!-- MEANWHILE: the title is a cut-paper layer inside the plate, the near hill in front of it -->
<div class="card" id="meanwhile">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="mwSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d9fc4"/><stop offset=".7" stop-color="#f0d8b0"/><stop offset="1" stop-color="#f4dfb8"/></linearGradient>
    <filter id="paper" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2a1a08" flood-opacity=".38"/></filter>
    <radialGradient id="mwSun" cx="930" cy="250" r="160" gradientUnits="userSpaceOnUse"><stop offset=".15" stop-color="#fff1d4"/><stop offset=".3" stop-color="#ffe2b0" stop-opacity=".6"/><stop offset="1" stop-color="#ffe2b0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#mwSky)"/>
  <circle cx="930" cy="250" r="160" fill="url(#mwSun)"/>
  <path d="M0 300L80 240 150 270 240 200 330 262 430 214 520 270 610 230 700 280 800 236 900 276 1000 220 1100 262 1200 230V520H0Z" fill="#a9b6c2" filter="url(#paper)"/>
  <g filter="url(#paper)" fill="#7f9478">
    <path d="M0 340Q300 300 600 326T1200 316V520H0Z"/>
    <path d="M140 326l44-52 44 52Z"/><path d="M196 326l28-32 28 32Z"/>
    <path d="M1010 318h70v-26h-70Z"/><path d="M1000 292l45-18 45 18Z"/><path d="M1012 280h66v-10h-66Z"/><path d="M1006 270l39-14 39 14Z"/>
  </g>
  <text x="600" y="372" text-anchor="middle" font-family="'IM Fell English'" font-style="italic" font-size="196" fill="#f3ead8" filter="url(#paper)">Meanwhile</text>
  <g filter="url(#paper)">
    <path d="M0 386Q160 352 330 374T640 371Q800 352 960 376T1200 366V520H0Z" fill="#55704f"/>
    <g fill="#3f5a3c" transform="translate(0,-6)"><path d="M70 392l14-40 14 40Z"/><path d="M92 394l11-30 11 30Z"/><path d="M1100 380l16-46 16 46Z"/><path d="M1126 384l12-34 12 34Z"/></g>
    <g fill="#3f5a3c" transform="translate(0,-6)"><rect x="760" y="356" width="22" height="16"/><path d="M754 358l17-14 17 14Z"/><rect x="796" y="360" width="18" height="12"/><path d="M791 362l14-11 14 11Z"/></g>
  </g>
  <path d="M0 458Q300 430 620 452T1200 444V520H0Z" fill="#33472f" filter="url(#paper)"/>
</svg>
</div>

<!-- THE FOLDED YEAR: a creased sheet; the title runs across the fold, bars rise behind it -->
<div class="card" id="folded">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="fyL" x1="0" x2="1"><stop offset="0" stop-color="#0c1522"/><stop offset="1" stop-color="#132036"/></linearGradient>
    <linearGradient id="fyR" x1="0" x2="1"><stop offset="0" stop-color="#070d16"/><stop offset="1" stop-color="#0b1320"/></linearGradient>
    <clipPath id="fyLeft"><rect width="600" height="520"/></clipPath>
    <clipPath id="fyRight"><rect x="600" width="600" height="520"/></clipPath>
  </defs>
  <rect width="600" height="520" fill="url(#fyL)"/><rect x="600" width="600" height="520" fill="url(#fyR)"/>
  <g opacity=".85">
    <g fill="#8fb4e3"><rect x="548" y="380" width="34" height="140" rx="4"/><rect x="498" y="330" width="34" height="190" rx="4"/><rect x="448" y="282" width="34" height="238" rx="4"/><rect x="398" y="244" width="34" height="276" rx="4"/><rect x="348" y="222" width="34" height="298" rx="4"/><rect x="298" y="212" width="34" height="308" rx="4"/><rect x="248" y="220" width="34" height="300" rx="4"/></g>
    <g fill="#F0A63C"><rect x="618" y="372" width="34" height="148" rx="4"/><rect x="668" y="318" width="34" height="202" rx="4"/><rect x="718" y="272" width="34" height="248" rx="4"/><rect x="768" y="240" width="34" height="280" rx="4"/><rect x="818" y="218" width="34" height="302" rx="4"/><rect x="868" y="206" width="34" height="314" rx="4"/><rect x="918" y="214" width="34" height="306" rx="4"/></g>
  </g>
  <g font-family="Fraunces" font-style="italic" font-weight="300" font-size="132" text-anchor="middle">
    <text x="600" y="190" fill="#0A111B" opacity=".55" dy="4">The Folded Year</text>
    <text x="600" y="190" fill="#EEF2F8" clip-path="url(#fyLeft)">The Folded Year</text>
    <text x="600" y="190" fill="#c9d2de" clip-path="url(#fyRight)">The Folded Year</text>
  </g>
  <rect x="598" width="2" height="520" fill="#2a3a52"/><rect x="600" width="1.5" height="520" fill="#03070d"/>
  <rect x="600" width="40" height="520" fill="#000" opacity=".18"/>
</svg>
</div>

<!-- SEASONS DOT ART: the title is made of the dots, the last letters not yet coloured -->
<div class="card" id="dots"><canvas id="dotCv" width="1200" height="520"></canvas></div>

<!-- VEDIC LIVING: the title stands on the horizon, the sun rising behind it -->
<div class="card" id="vedic">
<svg width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="vdSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7eedd"/><stop offset="1" stop-color="#efd3a6"/></linearGradient>
    <radialGradient id="vdGlow" cx="760" cy="330" r="300" gradientUnits="userSpaceOnUse"><stop offset=".25" stop-color="#f2a35c" stop-opacity=".55"/><stop offset="1" stop-color="#f2a35c" stop-opacity="0"/></radialGradient>
    <clipPath id="above"><rect width="1200" height="330"/></clipPath>
  </defs>
  <rect width="1200" height="520" fill="url(#vdSky)"/>
  <circle cx="760" cy="330" r="300" fill="url(#vdGlow)"/>
  <path d="M440 330A320 320 0 0 1 1080 330" fill="none" stroke="#c9a679" stroke-width="2.5" stroke-dasharray="4 9"/>
  <circle cx="760" cy="330" r="118" fill="#cf6f2e" clip-path="url(#above)"/>
  <rect y="330" width="1200" height="190" fill="#e6c693"/>
  <path d="M0 330h1200" stroke="#0d6b61" stroke-width="5"/>
  <g stroke="#0d6b61" stroke-width="3" id="vdTicks"></g>
  <text x="96" y="330" font-family="Marcellus" font-size="150" fill="#0d6b61" letter-spacing="2">Vedic Living</text>
</svg>
</div>
<script>
const c=new URLSearchParams(location.search).get('c')||'dawn';document.getElementById(c).style.display='block';

// Vedic: the thirty muhurtas of the day along the horizon
{const g=document.getElementById('vdTicks');for(let i=0;i<=30;i++){const l=document.createElementNS('http://www.w3.org/2000/svg','path');const x=60+i*1080/30;l.setAttribute('d',`M${x} 334v${i%5?14:30}`);g.appendChild(l)}}
// Dot Art: sample the title into a dot grid, coloured by season from left to right
document.fonts.load('900 210px Nunito').then(()=>{const cv=document.getElementById('dotCv');if(!cv)return;const x=cv.getContext('2d');
  x.fillStyle='#f3efe7';x.fillRect(0,0,1200,520);
  const m=document.createElement('canvas');m.width=1200;m.height=520;const mx=m.getContext('2d');mx.fillStyle='#000';mx.textAlign='center';mx.textBaseline='alphabetic';
  mx.font='900 210px Nunito';mx.fillText('Seasons',600,238);mx.fillText('Dot Art',600,456);
  const d=mx.getImageData(0,0,1200,520).data,S=9,cols=['#3d5f86','#b0567a','#d9a441','#b5652f'];
  let minX=1200,maxX=0;for(let yy=0;yy<520;yy+=S)for(let xx=0;xx<1200;xx+=S)if(d[(yy*1200+xx)*4+3]>128){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx)}
  for(let yy=S/2|0;yy<520;yy+=S)for(let xx=S/2|0;xx<1200;xx+=S){const inside=d[(yy*1200+xx)*4+3]>128;
    if(inside){const t=(xx-minX)/(maxX-minX);const empty=yy>260&&t>.82;x.beginPath();x.arc(xx,yy,3.7,0,Math.PI*2);
      if(empty){x.strokeStyle='#cfc6b6';x.lineWidth=1.2;x.stroke()}else{x.fillStyle=cols[Math.min(3,Math.floor(t*4))];x.fill()}}
    else{x.beginPath();x.arc(xx,yy,1,0,Math.PI*2);x.fillStyle='#e7e0d3';x.fill()}}});
// stars
{const g=document.getElementById('stars');let a=7;const r=()=>(a=(a*16807)%2147483647)/2147483647;
 for(let i=0;i<90;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','circle');s.setAttribute('cx',r()*1200);s.setAttribute('cy',r()*420);s.setAttribute('r',(r()*1.3+.4).toFixed(2));s.setAttribute('opacity',(r()*.7+.3).toFixed(2));g.appendChild(s)}}
// worn road paint: a speckled mask
{const cv=document.createElement('canvas');cv.width=cv.height=220;const x=cv.getContext('2d');const im=x.createImageData(220,220);let a=3;const r=()=>(a=(a*16807)%2147483647)/2147483647;
 for(let i=0;i<im.data.length;i+=4){const v=r();im.data[i]=im.data[i+1]=im.data[i+2]=0;im.data[i+3]=v<.12?40:v<.2?150:255}
 x.putImageData(im,0,0);document.documentElement.style.setProperty('--wear',`url(${cv.toDataURL()})`)}
</script>
</body></html>
