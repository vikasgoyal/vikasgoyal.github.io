<svg viewBox="0 0 760 270" role="img" aria-label="A question goes to three agents with assigned viewpoints: proposer, skeptic and a critic. They exchange arguments for a fixed number of rounds. A separate judge reads the transcript against criteria and returns a decision, confidence and the strongest unresolved objection.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd" x="10" y="109" width="100" height="52" rx="8"/><text class="t" x="60" y="140" text-anchor="middle">Question</text>
 <rect class="nd" x="150" y="20" width="340" height="230" rx="10"/><text class="ts" x="320" y="40" text-anchor="middle">fixed rounds (2–3)</text>
 <rect class="nd-a" x="170" y="56" width="140" height="58" rx="8"/><text class="t" x="240" y="81" text-anchor="middle">Proposer</text><text class="ts" x="240" y="99" text-anchor="middle">argues for</text>
 <rect class="nd-a" x="330" y="56" width="140" height="58" rx="8"/><text class="t" x="400" y="81" text-anchor="middle">Skeptic</text><text class="ts" x="400" y="99" text-anchor="middle">argues against</text>
 <rect class="nd-a" x="250" y="170" width="140" height="58" rx="8"/><text class="t" x="320" y="195" text-anchor="middle">Critic</text><text class="ts" x="320" y="213" text-anchor="middle">e.g. security</text>
 <line class="ln" x1="310" y1="78" x2="328" y2="78" marker-end="url(#a)"/>
 <line class="ln" x1="328" y1="94" x2="312" y2="94" marker-end="url(#a)"/>
 <line class="ln" x1="250" y1="114" x2="290" y2="168" marker-end="url(#a)"/>
 <line class="ln" x1="390" y1="114" x2="350" y2="168" marker-end="url(#a)"/>
 <rect class="nd" x="515" y="14" width="90" height="40" rx="6"/><text class="ts" x="560" y="39" text-anchor="middle">criteria</text>
 <rect class="nd-g" x="520" y="103" width="120" height="64" rx="8"/><text class="t" x="580" y="130" text-anchor="middle">Judge</text><text class="ts" x="580" y="149" text-anchor="middle">didn't argue</text>
 <rect class="nd" x="660" y="80" width="90" height="110" rx="8"/><text class="t" x="705" y="110" text-anchor="middle">Decision</text><text class="ts" x="705" y="134" text-anchor="middle">confidence</text><text class="ts" x="705" y="152" text-anchor="middle">strongest</text><text class="ts" x="705" y="166" text-anchor="middle">objection</text>
 <line class="ln" x1="110" y1="135" x2="148" y2="135" marker-end="url(#a)"/>
 <line class="ln" x1="490" y1="135" x2="518" y2="135" marker-end="url(#a)"/>
 <line class="ln" x1="560" y1="54" x2="570" y2="101" stroke-dasharray="2 3"/>
 <line class="ln-a" x1="640" y1="135" x2="658" y2="135" marker-end="url(#aa)"/>
</svg>
