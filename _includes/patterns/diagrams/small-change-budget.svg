<svg viewBox="0 0 760 270" role="img" aria-label="A large task is planned against a size budget and split into a stack of small pull requests, each under the budget, each reviewed and mergeable on its own, with a feature flag at the end. A CI check blocks any pull request over the budget.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="90" width="130" height="68" rx="8"/><text class="t" x="75" y="119" text-anchor="middle">Large task</text><text class="ts" x="75" y="138" text-anchor="middle">~1,500 lines</text>
 <rect class="nd-a" x="180" y="90" width="130" height="68" rx="8"/><text class="t" x="245" y="119" text-anchor="middle">Agent plan</text><text class="ts" x="245" y="138" text-anchor="middle">split to budget</text>
 <rect class="nd" x="180" y="10" width="130" height="40" rx="6"/><text class="ts" x="245" y="35" text-anchor="middle">budget: 400 lines</text>
 <rect class="nd-a" x="360" y="20" width="160" height="36" rx="6"/><text class="ts" x="372" y="43">PR 1 · model</text>
 <rect class="nd-a" x="360" y="64" width="160" height="36" rx="6"/><text class="ts" x="372" y="87">PR 2 · conversion</text>
 <rect class="nd-a" x="360" y="108" width="160" height="36" rx="6"/><text class="ts" x="372" y="131">PR 3 · calculation</text>
 <rect class="nd-a" x="360" y="152" width="160" height="36" rx="6"/><text class="ts" x="372" y="175">PR 4 · PDF</text>
 <rect class="nd-a" x="360" y="196" width="160" height="36" rx="6"/><text class="ts" x="372" y="219">PR 5 · flag on</text>
 <rect class="nd" x="580" y="54" width="170" height="68" rx="8"/><text class="t" x="665" y="83" text-anchor="middle">Review + merge</text><text class="ts" x="665" y="102" text-anchor="middle">one at a time</text>
 <rect class="nd-g" x="580" y="154" width="170" height="68" rx="8"/><text class="t" x="665" y="183" text-anchor="middle">CI size check</text><text class="ts" x="665" y="202" text-anchor="middle">over budget → blocked</text>
 <line class="ln" x1="140" y1="124" x2="178" y2="124" marker-end="url(#a)"/>
 <line class="ln" x1="245" y1="50" x2="245" y2="88" stroke-dasharray="2 3"/>
 <path class="ln" d="M310 124 L335 124 L335 38 L358 38" marker-end="url(#a)"/>
 <line class="ln" x1="335" y1="82" x2="358" y2="82" marker-end="url(#a)"/>
 <line class="ln" x1="335" y1="126" x2="358" y2="126" marker-end="url(#a)"/>
 <path class="ln" d="M335 124 L335 214 L358 214" marker-end="url(#a)"/>
 <line class="ln" x1="335" y1="170" x2="358" y2="170" marker-end="url(#a)"/>
 <line class="ln" x1="520" y1="88" x2="578" y2="88" marker-end="url(#a)"/>
 <line class="ln-h" x1="665" y1="152" x2="665" y2="124" marker-end="url(#ah)"/>
 <text class="ts" x="545" y="252" text-anchor="middle">each PR builds, passes tests and rolls back on its own</text>
</svg>
