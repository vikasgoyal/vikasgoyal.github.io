<svg viewBox="0 0 760 270" role="img" aria-label="A question is split into sub-questions. Each round the agent searches, reads and extracts findings into a notes file, then assesses gaps and conflicts. If gaps remain and new information is still coming in, it plans the next round. When information gain is low, coverage is full or the budget runs out, it writes a cited synthesis.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="96" width="100" height="56" rx="8"/><text class="t" x="60" y="120" text-anchor="middle">Question</text><text class="ts" x="60" y="138" text-anchor="middle">split it up</text>
 <rect class="nd-a" x="140" y="88" width="120" height="72" rx="8"/><text class="t" x="200" y="118" text-anchor="middle">Search</text><text class="ts" x="200" y="138" text-anchor="middle">per gap</text>
 <rect class="nd-a" x="290" y="88" width="130" height="72" rx="8"/><text class="t" x="355" y="118" text-anchor="middle">Read + extract</text><text class="ts" x="355" y="138" text-anchor="middle">with citations</text>
 <path class="nd" d="M520 64 L596 124 L520 184 L444 124 Z"/><text class="t" x="520" y="121" text-anchor="middle">Assess</text><text class="ts" x="520" y="137" text-anchor="middle">gaps · conflicts</text>
 <rect class="nd" x="620" y="92" width="130" height="64" rx="8"/><text class="t" x="685" y="118" text-anchor="middle">Synthesis</text><text class="ts" x="685" y="137" text-anchor="middle">claim → source</text>
 <rect class="nd-g" x="290" y="14" width="130" height="40" rx="6"/><text class="ts" x="355" y="38" text-anchor="middle">notes file</text>
 <line class="ln" x1="110" y1="124" x2="138" y2="124" marker-end="url(#a)"/>
 <line class="ln" x1="260" y1="124" x2="288" y2="124" marker-end="url(#a)"/>
 <line class="ln" x1="420" y1="124" x2="442" y2="124" marker-end="url(#a)"/>
 <line class="ln" x1="355" y1="88" x2="355" y2="56" stroke-dasharray="2 3"/>
 <line class="ln-a" x1="596" y1="124" x2="618" y2="124" marker-end="url(#aa)"/>
 <text class="ts" x="685" y="186" text-anchor="middle">stop: low new info,</text><text class="ts" x="685" y="200" text-anchor="middle">full coverage or budget</text>
 <path class="ln-h" d="M520 184 L520 236 L200 236 L200 162" marker-end="url(#ah)"/><text class="ts" x="360" y="254" text-anchor="middle">gaps remain → plan next round</text>
</svg>
