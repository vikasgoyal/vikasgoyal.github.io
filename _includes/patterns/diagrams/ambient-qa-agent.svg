<svg viewBox="0 0 760 270" role="img" aria-label="People write behaviour rules. An ambient agent checks the running system against them on a schedule, against staging and read-only against production. When all rules hold it does nothing. When a rule breaks it reproduces the problem, writes a failing test and a proposed fix, and opens a pull request that goes through the normal review gates before people merge it.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="30" width="150" height="60" rx="8"/><text class="t" x="85" y="56" text-anchor="middle">Behaviour rules</text><text class="ts" x="85" y="74" text-anchor="middle">owned by people</text>
 <rect class="nd" x="10" y="170" width="150" height="60" rx="8"/><text class="t" x="85" y="196" text-anchor="middle">Running system</text><text class="ts" x="85" y="214" text-anchor="middle">staging · prod read-only</text>
 <rect class="nd-a" x="220" y="100" width="150" height="60" rx="8"/><text class="t" x="295" y="126" text-anchor="middle">Ambient agent</text><text class="ts" x="295" y="144" text-anchor="middle">checks on schedule</text>
 <rect class="nd-g" x="430" y="30" width="150" height="60" rx="8"/><text class="t" x="505" y="56" text-anchor="middle">All rules hold</text><text class="ts" x="505" y="74" text-anchor="middle">nothing to do</text>
 <rect class="nd-a" x="430" y="170" width="150" height="60" rx="8"/><text class="t" x="505" y="196" text-anchor="middle">Reproduce</text><text class="ts" x="505" y="214" text-anchor="middle">failing test + fix</text>
 <rect class="nd-a" x="620" y="170" width="130" height="60" rx="8"/><text class="t" x="685" y="196" text-anchor="middle">Pull request</text><text class="ts" x="685" y="214" text-anchor="middle">normal gates</text>
 <rect class="nd" x="620" y="30" width="130" height="60" rx="8"/><text class="t" x="685" y="56" text-anchor="middle">Merged</text><text class="ts" x="685" y="74" text-anchor="middle">by people</text>
 <path class="ln" d="M160 60 L190 60 L190 120 L218 120" marker-end="url(#a)"/>
 <path class="ln" d="M160 200 L190 200 L190 140 L218 140" marker-end="url(#a)"/>
 <path class="ln" d="M370 120 L400 120 L400 60 L428 60" marker-end="url(#a)"/><text class="ts" x="378" y="100" text-anchor="start">pass</text>
 <path class="ln-h" d="M370 140 L400 140 L400 200 L428 200" marker-end="url(#ah)"/><text class="ts" x="376" y="165" text-anchor="start">rule breaks</text>
 <path class="ln-a" d="M580 200 L618 200" marker-end="url(#aa)"/>
 <path class="ln-a" d="M685 170 L685 92" marker-end="url(#aa)"/><text class="ts" x="692" y="136" text-anchor="start">review</text>
</svg>
