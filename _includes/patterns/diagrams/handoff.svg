<svg viewBox="0 0 760 270" role="img" aria-label="The customer talks directly to whichever agent is active. Sales, Billing and Support agents hand off to each other with a summary. After too many hops, the conversation goes to a human.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="100" width="110" height="52" rx="8"/><text class="t" x="65" y="131" text-anchor="middle">Customer</text>
 <rect class="nd-a" x="220" y="22" width="150" height="62" rx="8"/><text class="t" x="295" y="49" text-anchor="middle">Sales agent</text><text class="ts" x="295" y="68" text-anchor="middle">active now</text>
 <rect class="nd" x="470" y="22" width="150" height="62" rx="8"/><text class="t" x="545" y="49" text-anchor="middle">Billing agent</text><text class="ts" x="545" y="68" text-anchor="middle">invoices · refunds</text>
 <rect class="nd" x="345" y="170" width="150" height="62" rx="8"/><text class="t" x="420" y="197" text-anchor="middle">Support agent</text><text class="ts" x="420" y="216" text-anchor="middle">technical issues</text>
 <rect class="nd-g" x="640" y="170" width="110" height="62" rx="8"/><text class="t" x="695" y="197" text-anchor="middle">Human</text><text class="ts" x="695" y="216" text-anchor="middle">hop limit hit</text>
 <path class="ln-a" d="M120 118 C 170 118, 170 53, 218 53" marker-end="url(#aa)"/>
 <path class="ln-a" d="M218 63 C 180 63, 175 128, 122 128" marker-end="url(#aa)"/>
 <text class="ts" x="160" y="170" text-anchor="middle">talks directly</text>
 <text class="ts" x="160" y="184" text-anchor="middle">to active agent</text>
 <line class="ln" x1="370" y1="45" x2="468" y2="45" marker-end="url(#a)"/>
 <line class="ln" x1="468" y1="62" x2="372" y2="62" marker-end="url(#a)"/>
 <text class="ts" x="419" y="16" text-anchor="middle">handoff + summary</text>
 <line class="ln" x1="320" y1="84" x2="380" y2="168" marker-end="url(#a)"/>
 <line class="ln" x1="520" y1="84" x2="460" y2="168" marker-end="url(#a)"/>
 <path class="ln-h" d="M495 212 L638 212" marker-end="url(#ah)"/>
</svg>
