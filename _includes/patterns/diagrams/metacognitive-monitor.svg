<svg viewBox="0 0 760 270" role="img" aria-label="A fast agent loop runs steps and writes a trace. A monitor reads the trace after every step. When a surprise signal fires, the run pauses and System 2 diagnoses, replans, or escalates to a human.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="36" width="90" height="52" rx="8"/><text class="t" x="55" y="67" text-anchor="middle">Task</text>
 <rect class="nd-a" x="140" y="28" width="170" height="68" rx="8"/><text class="t" x="225" y="57" text-anchor="middle">Fast agent loop</text><text class="ts" x="225" y="76" text-anchor="middle">System 1 · steps</text>
 <rect class="nd" x="360" y="36" width="130" height="52" rx="8"/><text class="t" x="425" y="67" text-anchor="middle">Trace</text>
 <rect class="nd" x="620" y="36" width="130" height="52" rx="8"/><text class="t" x="685" y="67" text-anchor="middle">Result</text>
 <rect class="nd-a" x="360" y="150" width="130" height="68" rx="8"/><text class="t" x="425" y="179" text-anchor="middle">Monitor</text><text class="ts" x="425" y="198" text-anchor="middle">rules + small model</text>
 <rect class="nd-g" x="560" y="150" width="190" height="68" rx="8"/><text class="t" x="655" y="179" text-anchor="middle">System 2</text><text class="ts" x="655" y="198" text-anchor="middle">diagnose · replan · escalate</text>
 <line class="ln" x1="100" y1="62" x2="138" y2="62" marker-end="url(#a)"/>
 <line class="ln" x1="310" y1="62" x2="358" y2="62" marker-end="url(#a)"/><text class="ts" x="334" y="53" text-anchor="middle">each step</text>
 <path class="ln-a" d="M310 40 L330 40 L330 14 L685 14 L685 34" marker-end="url(#aa)"/><text class="ts" x="560" y="10" text-anchor="middle">no surprises</text>
 <line class="ln" x1="425" y1="88" x2="425" y2="148" marker-end="url(#a)"/><text class="ts" x="433" y="122">reads</text>
 <line class="ln-h" x1="490" y1="184" x2="558" y2="184" marker-end="url(#ah)"/><text class="ts" x="524" y="175" text-anchor="middle">signal</text>
 <path class="ln-h" d="M360 196 L225 196 L225 98" marker-end="url(#ah)"/><text class="ts" x="233" y="150">pause</text>
 <path class="ln" d="M655 218 L655 250 L180 250 L180 98" marker-end="url(#a)"/><text class="ts" x="420" y="244" text-anchor="middle">new plan · resume</text>
</svg>
