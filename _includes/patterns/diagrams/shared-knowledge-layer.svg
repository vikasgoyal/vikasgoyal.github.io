<svg viewBox="0 0 760 270" role="img" aria-label="Sources such as decision records, incident reviews and pull requests feed a shared knowledge layer. Each entry has an owner, source, date and a fact or interpretation label. A retrieval step filters entries by task and access scope and gives them to coding agents in each repository, alongside a short project memory file. Entries past their review date are flagged for owners.">
 <defs>
