 <rect class="nd-a" x="610" y="20" width="140" height="52" rx="8"/><text class="t" x="680" y="42" text-anchor="middle">Repo A agent</text><text class="ts" x="680" y="60" text-anchor="middle">+ CLAUDE.md</text>
