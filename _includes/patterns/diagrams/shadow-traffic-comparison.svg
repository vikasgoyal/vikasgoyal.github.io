<svg viewBox="0 0 760 270" role="img" aria-label="A thin router sends each real request to the current system, whose response goes back to the user, and mirrors it to the new system, whose response is only recorded. A comparator normalizes fields that may differ and logs mismatches. Each mismatch becomes a failing test for the coding agent, which fixes the new system. When the mismatch rate stays below the bar, traffic shifts to the new system in steps.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="100" width="100" height="60" rx="8"/><text class="t" x="60" y="126" text-anchor="middle">Users</text><text class="ts" x="60" y="144" text-anchor="middle">real requests</text>
 <rect class="nd-a" x="150" y="100" width="110" height="60" rx="8"/><text class="t" x="205" y="126" text-anchor="middle">Router</text><text class="ts" x="205" y="144" text-anchor="middle">mirror 100%</text>
 <rect class="nd" x="310" y="30" width="150" height="60" rx="8"/><text class="t" x="385" y="56" text-anchor="middle">Old system</text><text class="ts" x="385" y="74" text-anchor="middle">answers users</text>
 <rect class="nd-g" x="310" y="170" width="150" height="60" rx="8"/><text class="t" x="385" y="196" text-anchor="middle">New system</text><text class="ts" x="385" y="214" text-anchor="middle">answer recorded</text>
 <rect class="nd-a" x="510" y="100" width="110" height="60" rx="8"/><text class="t" x="565" y="126" text-anchor="middle">Compare</text><text class="ts" x="565" y="144" text-anchor="middle">normalize · diff</text>
 <rect class="nd-g" x="510" y="200" width="240" height="50" rx="8"/><text class="t" x="630" y="222" text-anchor="middle">Coding agent</text><text class="ts" x="630" y="240" text-anchor="middle">mismatch → failing test → fix</text>
 <rect class="nd-a" x="660" y="100" width="90" height="60" rx="8"/><text class="t" x="705" y="126" text-anchor="middle">Cut over</text><text class="ts" x="705" y="144" text-anchor="middle">1→10→100%</text>
 <line class="ln" x1="110" y1="130" x2="148" y2="130" marker-end="url(#a)"/>
 <path class="ln" d="M260 120 L285 120 L285 60 L308 60" marker-end="url(#a)"/>
 <path class="ln" d="M260 140 L285 140 L285 200 L308 200" marker-end="url(#a)"/><text class="ts" x="290" y="165">mirror</text>
 <path class="ln" d="M460 60 L485 60 L485 120 L508 120" marker-end="url(#a)"/>
 <path class="ln" d="M460 200 L485 200 L485 140 L508 140" marker-end="url(#a)"/>
 <path class="ln" d="M385 30 L385 14 L60 14 L60 98" marker-end="url(#a)"/><text class="ts" x="222" y="10" text-anchor="middle">response to user</text>
 <line class="ln-a" x1="620" y1="130" x2="658" y2="130" marker-end="url(#aa)"/><text class="ts" x="639" y="121" text-anchor="middle">clean</text>
 <line class="ln-h" x1="565" y1="160" x2="565" y2="198" marker-end="url(#ah)"/>
 <path class="ln-h" d="M510 225 L470 225 L470 215 L462 215" marker-end="url(#ah)"/>
</svg>
