<svg viewBox="0 0 760 270" role="img" aria-label="An idea file is drafted into a spec by the agent. The developer edits and approves the spec. Build sessions read the spec, write code and run tests against the acceptance criteria. Direction changes from chat go into the spec first. At the end of the milestone, lasting decisions move into the project memory file.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="90" width="100" height="56" rx="8"/><text class="t" x="60" y="114" text-anchor="middle">idea.md</text><text class="ts" x="60" y="132" text-anchor="middle">6 lines</text>
 <rect class="nd-a" x="160" y="70" width="190" height="96" rx="8"/><text class="t" x="255" y="96" text-anchor="middle">mvp-spec.md</text><text class="ts" x="255" y="118" text-anchor="middle">goal · scope · non-goals</text><text class="ts" x="255" y="134" text-anchor="middle">acceptance criteria</text><text class="ts" x="255" y="150" text-anchor="middle">developer approves</text>
 <rect class="nd-a" x="410" y="84" width="150" height="68" rx="8"/><text class="t" x="485" y="113" text-anchor="middle">Build sessions</text><text class="ts" x="485" y="132" text-anchor="middle">read spec first</text>
 <path class="nd" d="M650 74 L710 118 L650 162 L590 118 Z"/><text class="t" x="650" y="115" text-anchor="middle">Criteria</text><text class="ts" x="650" y="131" text-anchor="middle">all pass?</text>
 <rect class="nd" x="160" y="10" width="190" height="40" rx="6"/><text class="ts" x="255" y="35" text-anchor="middle">chat · direction change</text>
 <rect class="nd" x="560" y="200" width="190" height="52" rx="8"/><text class="t" x="655" y="222" text-anchor="middle">CLAUDE.md</text><text class="ts" x="655" y="240" text-anchor="middle">lasting decisions</text>
 <line class="ln" x1="110" y1="118" x2="158" y2="118" marker-end="url(#a)"/><text class="ts" x="134" y="109" text-anchor="middle">draft</text>
 <line class="ln-h" x1="255" y1="50" x2="255" y2="68" marker-end="url(#ah)"/><text class="ts" x="262" y="63">spec first</text>
 <line class="ln-a" x1="350" y1="118" x2="408" y2="118" marker-end="url(#aa)"/>
 <line class="ln" x1="560" y1="118" x2="588" y2="118" marker-end="url(#a)"/>
 <path class="ln" d="M650 162 L650 198" marker-end="url(#a)"/><text class="ts" x="658" y="186">ship</text>
 <path class="ln-h" d="M620 140 L620 176 L485 176 L485 154" marker-end="url(#ah)"/><text class="ts" x="490" y="192">not yet → keep building</text>
</svg>
