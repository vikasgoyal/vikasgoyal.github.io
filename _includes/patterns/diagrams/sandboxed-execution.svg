<svg viewBox="0 0 760 270" role="img" aria-label="Inside an isolated sandbox, the agent works on a copy of the data and code, takes checkpoints and can roll back. Network access is limited to an allowlist. The only way out is a promotion gate with tests and review, which leads to the real system.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd-g" x="10" y="20" width="440" height="220" rx="12"/><text class="t" x="30" y="46">Sandbox</text><text class="ts" x="430" y="46" text-anchor="end">no production credentials</text>
 <rect class="nd-a" x="30" y="70" width="140" height="68" rx="8"/><text class="t" x="100" y="99" text-anchor="middle">Agent</text><text class="ts" x="100" y="118" text-anchor="middle">writes · runs code</text>
 <rect class="nd" x="230" y="70" width="190" height="68" rx="8"/><text class="t" x="325" y="99" text-anchor="middle">Copy of repo + data</text><text class="ts" x="325" y="118" text-anchor="middle">branch · test DB</text>
 <rect class="nd" x="230" y="160" width="190" height="56" rx="8"/><text class="t" x="325" y="184" text-anchor="middle">Checkpoints</text><text class="ts" x="325" y="202" text-anchor="middle">roll back on failure</text>
 <rect class="nd" x="30" y="160" width="140" height="56" rx="8"/><text class="t" x="100" y="184" text-anchor="middle">Network</text><text class="ts" x="100" y="202" text-anchor="middle">allowlist only</text>
 <path class="nd" d="M540 82 L600 130 L540 178 L480 130 Z"/><text class="t" x="540" y="126" text-anchor="middle">Promote</text><text class="ts" x="540" y="142" text-anchor="middle">tests + review</text>
 <rect class="nd" x="630" y="104" width="120" height="52" rx="8"/><text class="t" x="690" y="128" text-anchor="middle">Real system</text><text class="ts" x="690" y="145" text-anchor="middle">via PR / diff</text>
 <line class="ln" x1="170" y1="104" x2="228" y2="104" marker-end="url(#a)"/>
 <line class="ln" x1="325" y1="138" x2="325" y2="158" marker-end="url(#a)"/>
 <line class="ln" x1="100" y1="138" x2="100" y2="158" stroke-dasharray="2 3"/>
 <line class="ln" x1="420" y1="104" x2="448" y2="104"/>
 <path class="ln" d="M448 104 L460 104 L460 130 L478 130" marker-end="url(#a)"/>
 <line class="ln-a" x1="600" y1="130" x2="628" y2="130" marker-end="url(#aa)"/>
 <path class="ln-h" d="M540 178 L540 256 L325 256 L325 218" marker-end="url(#ah)"/><text class="ts" x="548" y="222">fails → back</text>
</svg>
