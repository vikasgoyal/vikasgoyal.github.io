<svg viewBox="0 0 760 270" role="img" aria-label="A request goes to a fast drafting model. A reasoning model verifies the draft against sources. Verified drafts ship unchanged, small errors get minimal fixes, and broken drafts are regenerated by the strong model.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="104" width="100" height="52" rx="8"/><text class="t" x="60" y="135" text-anchor="middle">Request</text>
 <rect class="nd-a" x="150" y="96" width="140" height="68" rx="8"/><text class="t" x="220" y="125" text-anchor="middle">Draft</text><text class="ts" x="220" y="144" text-anchor="middle">System 1 · fast</text>
 <rect class="nd-g" x="340" y="96" width="140" height="68" rx="8"/><text class="t" x="410" y="125" text-anchor="middle">Verify</text><text class="ts" x="410" y="144" text-anchor="middle">System 2 · per claim</text>
 <rect class="nd" x="345" y="14" width="130" height="40" rx="6"/><text class="ts" x="410" y="39" text-anchor="middle">sources · data</text>
 <rect class="nd" x="560" y="20" width="190" height="52" rx="8"/><text class="t" x="655" y="42" text-anchor="middle">Ship as-is</text><text class="ts" x="655" y="60" text-anchor="middle">all claims supported</text>
 <rect class="nd" x="560" y="104" width="190" height="52" rx="8"/><text class="t" x="655" y="126" text-anchor="middle">Apply small fixes</text><text class="ts" x="655" y="144" text-anchor="middle">minimal edits</text>
 <rect class="nd-g" x="560" y="188" width="190" height="52" rx="8"/><text class="t" x="655" y="210" text-anchor="middle">Regenerate</text><text class="ts" x="655" y="228" text-anchor="middle">strong model rewrites</text>
 <line class="ln" x1="110" y1="130" x2="148" y2="130" marker-end="url(#a)"/>
 <line class="ln" x1="290" y1="130" x2="338" y2="130" marker-end="url(#a)"/><text class="ts" x="314" y="121" text-anchor="middle">draft</text>
 <line class="ln" x1="410" y1="54" x2="410" y2="94" stroke-dasharray="2 3"/>
 <path class="ln-a" d="M480 120 C 520 120, 520 46, 558 46" marker-end="url(#aa)"/>
 <line class="ln" x1="480" y1="130" x2="558" y2="130" marker-end="url(#a)"/>
 <path class="ln-h" d="M480 140 C 520 140, 520 214, 558 214" marker-end="url(#ah)"/>
</svg>
