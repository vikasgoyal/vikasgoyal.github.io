<svg viewBox="0 0 760 270" role="img" aria-label="A CLAUDE.md file in the repo root holds commands, architecture, decisions and rules. It is loaded into every agent session. Mistakes and decisions from each session become short rules, which are reviewed in a pull request and added back to the file.">
