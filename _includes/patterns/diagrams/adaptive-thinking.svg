<svg viewBox="0 0 760 260" role="img" aria-label="A request goes to a policy that picks an effort level of low, medium or high for the same model. A check runs on the output; if it fails, the request retries one level higher.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="94" width="100" height="52" rx="8"/><text class="t" x="60" y="125" text-anchor="middle">Request</text>
 <rect class="nd-a" x="150" y="86" width="130" height="68" rx="8"/><text class="t" x="215" y="115" text-anchor="middle">Policy</text><text class="ts" x="215" y="134" text-anchor="middle">type · stakes · size</text>
 <rect class="nd" x="320" y="20" width="240" height="190" rx="10"/><text class="t" x="440" y="44" text-anchor="middle">One model</text>
 <rect class="nd-a" x="340" y="58" width="200" height="38" rx="6"/><text class="t" x="356" y="82">Low</text><text class="ts" x="524" y="81" text-anchor="end">no thinking · ~2s</text>
 <rect class="nd-a" x="340" y="104" width="200" height="38" rx="6"/><text class="t" x="356" y="128">Medium</text><text class="ts" x="524" y="127" text-anchor="end">some · ~10s</text>
 <rect class="nd-g" x="340" y="150" width="200" height="38" rx="6"/><text class="t" x="356" y="174">High</text><text class="ts" x="524" y="173" text-anchor="end">max budget · ~60s</text>
 <path class="nd" d="M630 74 L670 120 L630 166 L590 120 Z"/><text class="t" x="630" y="124" text-anchor="middle">Check</text>
 <rect class="nd" x="690" y="94" width="60" height="52" rx="8"/><text class="t" x="720" y="125" text-anchor="middle">Out</text>
 <line class="ln" x1="110" y1="120" x2="148" y2="120" marker-end="url(#a)"/>
 <line class="ln" x1="280" y1="120" x2="318" y2="120" marker-end="url(#a)"/>
 <line class="ln" x1="560" y1="120" x2="588" y2="120" marker-end="url(#a)"/>
 <line class="ln-a" x1="670" y1="120" x2="688" y2="120" marker-end="url(#aa)"/>
 <path class="ln-h" d="M630 166 L630 236 L440 236 L440 212" marker-end="url(#ah)"/><text class="ts" x="535" y="252" text-anchor="middle">fails → retry one level higher</text>
</svg>
