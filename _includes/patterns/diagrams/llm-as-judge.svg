<svg viewBox="0 0 760 270" role="img" aria-label="A rubric and a set of human-labeled examples calibrate a judge model. The judge scores outputs from two sources: a fixed test set in CI and a sample of live traffic. Results feed a CI gate and a quality dashboard with alerts. Borderline scores go to human review.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="200" y="10" width="150" height="44" rx="6"/><text class="ts" x="275" y="36" text-anchor="middle">rubric · 4 criteria</text>
 <rect class="nd" x="370" y="10" width="170" height="44" rx="6"/><text class="ts" x="455" y="36" text-anchor="middle">200 human labels</text>
 <rect class="nd" x="10" y="80" width="150" height="52" rx="8"/><text class="t" x="85" y="103" text-anchor="middle">CI test set</text><text class="ts" x="85" y="121" text-anchor="middle">every change</text>
 <rect class="nd" x="10" y="160" width="150" height="52" rx="8"/><text class="t" x="85" y="183" text-anchor="middle">Live sample</text><text class="ts" x="85" y="201" text-anchor="middle">5% of traffic</text>
 <rect class="nd-a" x="250" y="104" width="240" height="84" rx="8"/><text class="t" x="370" y="130" text-anchor="middle">Judge model</text><text class="ts" x="370" y="152" text-anchor="middle">score per criterion</text><text class="ts" x="370" y="168" text-anchor="middle">+ reason for each</text>
 <rect class="nd" x="580" y="70" width="170" height="52" rx="8"/><text class="t" x="665" y="93" text-anchor="middle">CI gate</text><text class="ts" x="665" y="111" text-anchor="middle">block regressions</text>
 <rect class="nd" x="580" y="140" width="170" height="52" rx="8"/><text class="t" x="665" y="163" text-anchor="middle">Dashboard</text><text class="ts" x="665" y="181" text-anchor="middle">alerts on drops</text>
 <rect class="nd-g" x="580" y="210" width="170" height="52" rx="8"/><text class="t" x="665" y="233" text-anchor="middle">Human review</text><text class="ts" x="665" y="251" text-anchor="middle">borderline scores</text>
 <line class="ln" x1="275" y1="54" x2="300" y2="102" stroke-dasharray="2 3"/>
 <line class="ln" x1="455" y1="54" x2="430" y2="102" stroke-dasharray="2 3"/><text class="ts" x="452" y="78">calibrate</text>
 <path class="ln" d="M160 106 C 205 106, 205 132, 248 132" marker-end="url(#a)"/>
 <path class="ln" d="M160 186 C 205 186, 205 160, 248 160" marker-end="url(#a)"/>
 <path class="ln-a" d="M490 130 C 535 130, 535 96, 578 96" marker-end="url(#aa)"/>
 <line class="ln-a" x1="490" y1="160" x2="578" y2="166" marker-end="url(#aa)"/>
 <path class="ln-h" d="M490 176 C 535 176, 535 236, 578 236" marker-end="url(#ah)"/>
</svg>
