<svg viewBox="0 0 760 270" role="img" aria-label="The model requests tool calls. A policy engine checks each one against the envelope: allowed tools, scopes and budgets. Calls inside the envelope execute; calls outside are rejected with a clear error and flagged.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd-a" x="10" y="96" width="130" height="68" rx="8"/><text class="t" x="75" y="125" text-anchor="middle">Model</text><text class="ts" x="75" y="144" text-anchor="middle">requests a call</text>
 <rect class="nd" x="190" y="20" width="250" height="230" rx="12"/><text class="t" x="315" y="46" text-anchor="middle">Envelope · policy engine</text>
 <rect class="nd-g" x="210" y="62" width="210" height="44" rx="6"/><text class="t" x="222" y="81">Tools</text><text class="ts" x="222" y="97">allowlist · no delete</text>
 <rect class="nd-g" x="210" y="114" width="210" height="44" rx="6"/><text class="t" x="222" y="133">Scopes</text><text class="ts" x="222" y="149">read vs write · which data</text>
 <rect class="nd-g" x="210" y="166" width="210" height="44" rx="6"/><text class="t" x="222" y="185">Budgets</text><text class="ts" x="222" y="201">$250 each · $2k/day · steps</text>
 <text class="ts" x="315" y="234" text-anchor="middle">enforced in runtime, not prompt</text>
 <rect class="nd" x="520" y="40" width="230" height="64" rx="8"/><text class="t" x="635" y="67" text-anchor="middle">Execute</text><text class="ts" x="635" y="86" text-anchor="middle">inside envelope</text>
 <rect class="nd-g" x="520" y="160" width="230" height="64" rx="8"/><text class="t" x="635" y="187" text-anchor="middle">Reject + flag</text><text class="ts" x="635" y="206" text-anchor="middle">clear error back to agent</text>
 <line class="ln" x1="140" y1="130" x2="188" y2="130" marker-end="url(#a)"/>
 <path class="ln-a" d="M440 110 C 480 110, 480 72, 518 72" marker-end="url(#aa)"/>
 <path class="ln-h" d="M440 150 C 480 150, 480 192, 518 192" marker-end="url(#ah)"/>
 <path class="ln-h" d="M635 224 L635 258 L75 258 L75 166" marker-end="url(#ah)"/>
</svg>
