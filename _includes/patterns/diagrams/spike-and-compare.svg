<svg viewBox="0 0 760 270" role="img" aria-label="A design question with written criteria is given to three agent runs, one per option, each with the same timebox and test harness. Each produces a spike and a one-page result. The team compares results against the criteria and picks one, writing a decision record. Losing spikes are deleted, and the winner is rebuilt from a spec.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="90" width="150" height="80" rx="8"/><text class="t" x="85" y="118" text-anchor="middle">Question</text><text class="ts" x="85" y="138" text-anchor="middle">3 options</text><text class="ts" x="85" y="155" text-anchor="middle">criteria written first</text>
 <rect class="nd-g" x="210" y="20" width="150" height="56" rx="8"/><text class="t" x="285" y="44" text-anchor="middle">Agent · option A</text><text class="ts" x="285" y="62" text-anchor="middle">spike + result</text>
 <rect class="nd-g" x="210" y="102" width="150" height="56" rx="8"/><text class="t" x="285" y="126" text-anchor="middle">Agent · option B</text><text class="ts" x="285" y="144" text-anchor="middle">spike + result</text>
 <rect class="nd-g" x="210" y="184" width="150" height="56" rx="8"/><text class="t" x="285" y="208" text-anchor="middle">Agent · option C</text><text class="ts" x="285" y="226" text-anchor="middle">spike + result</text>
 <rect class="nd-a" x="410" y="90" width="140" height="80" rx="8"/><text class="t" x="480" y="118" text-anchor="middle">Team compares</text><text class="ts" x="480" y="138" text-anchor="middle">against criteria</text><text class="ts" x="480" y="155" text-anchor="middle">decision record</text>
 <rect class="nd-a" x="600" y="40" width="150" height="56" rx="8"/><text class="t" x="675" y="64" text-anchor="middle">Rebuild winner</text><text class="ts" x="675" y="82" text-anchor="middle">from a spec</text>
 <rect class="nd-g" x="600" y="164" width="150" height="56" rx="8"/><text class="t" x="675" y="188" text-anchor="middle">Delete spikes</text><text class="ts" x="675" y="206" text-anchor="middle">including winner's</text>
 <path class="ln" d="M160 115 L185 115 L185 48 L208 48" marker-end="url(#a)"/>
 <line class="ln" x1="160" y1="130" x2="208" y2="130" marker-end="url(#a)"/>
 <path class="ln" d="M160 145 L185 145 L185 212 L208 212" marker-end="url(#a)"/><text class="ts" x="96" y="196" text-anchor="middle">same timebox</text><text class="ts" x="96" y="212" text-anchor="middle">same harness</text>
 <path class="ln" d="M360 48 L385 48 L385 115 L408 115" marker-end="url(#a)"/>
 <line class="ln" x1="360" y1="130" x2="408" y2="130" marker-end="url(#a)"/>
 <path class="ln" d="M360 212 L385 212 L385 145 L408 145" marker-end="url(#a)"/>
 <path class="ln-a" d="M550 115 L575 115 L575 68 L598 68" marker-end="url(#aa)"/>
 <path class="ln-h" d="M550 145 L575 145 L575 192 L598 192" marker-end="url(#ah)"/>
</svg>
