<svg viewBox="0 0 760 270" role="img" aria-label="A pull request passes CI, then an AI reviewer checks it against the review checklist and spec, posting findings and a risk summary. The author fixes mechanical findings. A human reviewer starts from the risk summary and approves or requests changes. Accepted and dismissed findings tune the checklist.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="94" width="100" height="56" rx="8"/><text class="t" x="60" y="118" text-anchor="middle">Pull request</text><text class="ts" x="60" y="136" text-anchor="middle">CI passed</text>
 <rect class="nd-a" x="150" y="78" width="160" height="88" rx="8"/><text class="t" x="230" y="104" text-anchor="middle">AI reviewer</text><text class="ts" x="230" y="126" text-anchor="middle">checklist + spec</text><text class="ts" x="230" y="142" text-anchor="middle">comments only</text>
 <rect class="nd" x="350" y="40" width="170" height="56" rx="8"/><text class="t" x="435" y="64" text-anchor="middle">Findings</text><text class="ts" x="435" y="82" text-anchor="middle">severity · line refs</text>
 <rect class="nd" x="350" y="148" width="170" height="56" rx="8"/><text class="t" x="435" y="172" text-anchor="middle">Risk summary</text><text class="ts" x="435" y="190" text-anchor="middle">look here first</text>
 <rect class="nd-a" x="580" y="40" width="170" height="56" rx="8"/><text class="t" x="665" y="64" text-anchor="middle">Author fixes</text><text class="ts" x="665" y="82" text-anchor="middle">mechanical issues</text>
 <rect class="nd-a" x="580" y="148" width="170" height="56" rx="8"/><text class="t" x="665" y="172" text-anchor="middle">Human review</text><text class="ts" x="665" y="190" text-anchor="middle">judgment · approves</text>
 <line class="ln" x1="110" y1="122" x2="148" y2="122" marker-end="url(#a)"/>
 <path class="ln" d="M310 104 C 330 104, 330 68, 348 68" marker-end="url(#a)"/>
 <path class="ln" d="M310 140 C 330 140, 330 176, 348 176" marker-end="url(#a)"/>
 <line class="ln" x1="520" y1="68" x2="578" y2="68" marker-end="url(#a)"/>
 <line class="ln-a" x1="520" y1="176" x2="578" y2="176" marker-end="url(#aa)"/>
 <line class="ln" x1="665" y1="96" x2="665" y2="146" marker-end="url(#a)"/>
 <path class="ln-h" d="M665 204 L665 250 L230 250 L230 168" marker-end="url(#ah)"/><text class="ts" x="448" y="244" text-anchor="middle">accepted / dismissed findings tune the checklist</text>
</svg>
