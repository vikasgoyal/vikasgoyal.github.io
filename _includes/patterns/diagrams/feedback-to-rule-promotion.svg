<svg viewBox="0 0 760 270" role="img" aria-label="Review comments on several pull requests are checked for repetition. A pattern seen on at least two pull requests becomes a rule in a small pull request that a person approves. Each rule goes into the file its tool reads: conventions in the project memory file, review rules in the review rules file, how to run the app in a verification skill, and pull request upkeep in a steward skill. Stale rules are deleted.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
