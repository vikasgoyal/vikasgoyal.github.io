 <line class="ln" x1="140" y1="82" x2="178" y2="100" marker-end="url(#a)"/>
 <line class="ln" x1="140" y1="126" x2="178" y2="110" marker-end="url(#a)"/>
 <path class="ln" d="M140 170 C 160 170, 160 116, 178 114" marker-end="url(#a)"/>
 <line class="ln" x1="320" y1="104" x2="358" y2="104" marker-end="url(#a)"/>
 <line class="ln" x1="490" y1="104" x2="528" y2="104" marker-end="url(#a)"/>
 <line class="ln-a" x1="630" y1="104" x2="658" y2="104" marker-end="url(#aa)"/>
