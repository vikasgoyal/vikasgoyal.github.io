<svg viewBox="0 0 760 270" role="img" aria-label="The agent receives a question and decides whether and where to retrieve. It sends rewritten queries to documents, tickets or a database. Results are graded; weak results trigger a rewrite or another source. Kept passages feed a cited answer.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="94" width="100" height="52" rx="8"/><text class="t" x="60" y="125" text-anchor="middle">Question</text>
 <rect class="nd-a" x="140" y="86" width="140" height="68" rx="8"/><text class="t" x="210" y="115" text-anchor="middle">Agent</text><text class="ts" x="210" y="134" text-anchor="middle">plan sub-queries</text>
 <rect class="nd" x="320" y="14" width="140" height="44" rx="8"/><text class="t" x="390" y="41" text-anchor="middle">Documents</text>
 <rect class="nd" x="320" y="98" width="140" height="44" rx="8"/><text class="t" x="390" y="125" text-anchor="middle">Tickets</text>
 <rect class="nd" x="320" y="182" width="140" height="44" rx="8"/><text class="t" x="390" y="209" text-anchor="middle">Database</text>
 <path class="nd" d="M550 74 L604 120 L550 166 L496 120 Z"/><text class="t" x="550" y="117" text-anchor="middle">Grade</text><text class="ts" x="550" y="133" text-anchor="middle">relevant?</text>
 <rect class="nd" x="634" y="88" width="116" height="64" rx="8"/><text class="t" x="692" y="115" text-anchor="middle">Answer</text><text class="ts" x="692" y="134" text-anchor="middle">cited claims</text>
 <line class="ln" x1="110" y1="120" x2="138" y2="120" marker-end="url(#a)"/>
 <path class="ln" d="M280 110 C 300 110, 300 36, 318 36" marker-end="url(#a)"/>
 <line class="ln" x1="280" y1="120" x2="318" y2="120" marker-end="url(#a)"/>
 <path class="ln" d="M280 130 C 300 130, 300 204, 318 204" marker-end="url(#a)"/>
 <path class="ln" d="M460 36 C 480 36, 480 110, 498 112" marker-end="url(#a)"/>
 <line class="ln" x1="460" y1="120" x2="494" y2="120" marker-end="url(#a)"/>
 <path class="ln" d="M460 204 C 480 204, 480 130, 498 128" marker-end="url(#a)"/>
 <line class="ln-a" x1="604" y1="120" x2="632" y2="120" marker-end="url(#aa)"/><text class="ts" x="618" y="80" text-anchor="middle">keep</text>
 <path class="ln-h" d="M550 166 L550 252 L210 252 L210 156" marker-end="url(#ah)"/><text class="ts" x="380" y="246" text-anchor="middle">weak results → rewrite query or try another source</text>
</svg>
