<svg viewBox="0 0 760 270" role="img" aria-label="A request passes through input guardrails, then the agent, whose tool calls are checked by tool guardrails, then output guardrails before the response. Each guardrail can block, redact, rewrite or escalate, and every block is logged.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="74" width="90" height="52" rx="8"/><text class="t" x="55" y="105" text-anchor="middle">Request</text>
 <rect class="nd-a" x="130" y="50" width="140" height="100" rx="8"/><text class="t" x="200" y="74" text-anchor="middle">Input checks</text><text class="ts" x="200" y="98" text-anchor="middle">injection</text><text class="ts" x="200" y="114" text-anchor="middle">personal data</text><text class="ts" x="200" y="130" text-anchor="middle">topic · size</text>
 <rect class="nd" x="300" y="66" width="140" height="68" rx="8"/><text class="t" x="370" y="95" text-anchor="middle">Agent</text><text class="ts" x="370" y="114" text-anchor="middle">model + tools</text>
 <rect class="nd-a" x="470" y="50" width="140" height="100" rx="8"/><text class="t" x="540" y="74" text-anchor="middle">Output checks</text><text class="ts" x="540" y="98" text-anchor="middle">data leaks</text><text class="ts" x="540" y="114" text-anchor="middle">policy</text><text class="ts" x="540" y="130" text-anchor="middle">schema</text>
 <rect class="nd" x="640" y="74" width="110" height="52" rx="8"/><text class="t" x="695" y="105" text-anchor="middle">Response</text>
 <rect class="nd-a" x="300" y="180" width="140" height="56" rx="8"/><text class="t" x="370" y="204" text-anchor="middle">Tool checks</text><text class="ts" x="370" y="222" text-anchor="middle">validate arguments</text>
 <rect class="nd-g" x="510" y="186" width="240" height="44" rx="8"/><text class="ts" x="630" y="213" text-anchor="middle">block · redact · rewrite · escalate</text>
 <line class="ln" x1="100" y1="100" x2="128" y2="100" marker-end="url(#a)"/>
 <line class="ln-a" x1="270" y1="100" x2="298" y2="100" marker-end="url(#aa)"/>
 <line class="ln" x1="440" y1="100" x2="468" y2="100" marker-end="url(#a)"/>
 <line class="ln-a" x1="610" y1="100" x2="638" y2="100" marker-end="url(#aa)"/>
 <line class="ln" x1="370" y1="134" x2="370" y2="178" marker-end="url(#a)"/>
 <path class="ln-h" d="M200 150 L200 252 L630 252 L630 232" marker-end="url(#ah)"/>
 <path class="ln-h" d="M540 150 L540 184" marker-end="url(#ah)"/>
 <line class="ln-h" x1="440" y1="208" x2="508" y2="208" marker-end="url(#ah)"/>
 <text class="ts" x="370" y="30" text-anchor="middle">enforced outside the model · every block logged</text>
</svg>
