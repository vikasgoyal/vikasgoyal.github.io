<svg viewBox="0 0 760 260" role="img" aria-label="Request flows to System 1 model, then an escalation gate. Pass goes to response; escalate goes to System 2 model, then response.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="100" width="100" height="52" rx="8"/><text class="t" x="60" y="131" text-anchor="middle">Request</text>
 <rect class="nd-a" x="150" y="92" width="140" height="68" rx="8"/><text class="t" x="220" y="120" text-anchor="middle">System 1</text><text class="ts" x="220" y="139" text-anchor="middle">fast model · ~0.5s</text>
 <path class="nd" d="M400 76 L470 126 L400 176 L330 126 Z"/><text class="t" x="400" y="122" text-anchor="middle">Gate</text><text class="ts" x="400" y="138" text-anchor="middle">4 signals</text>
 <rect class="nd" x="600" y="100" width="140" height="52" rx="8"/><text class="t" x="670" y="131" text-anchor="middle">Response</text>
 <rect class="nd-g" x="500" y="196" width="160" height="56" rx="8"/><text class="t" x="580" y="221" text-anchor="middle">System 2</text><text class="ts" x="580" y="239" text-anchor="middle">reasoning model · 5–30s</text>
 <line class="ln" x1="110" y1="126" x2="148" y2="126" marker-end="url(#a)"/>
 <line class="ln" x1="290" y1="126" x2="328" y2="126" marker-end="url(#a)"/>
 <line class="ln-a" x1="470" y1="126" x2="598" y2="126" marker-end="url(#aa)"/><text class="ts" x="534" y="117" text-anchor="middle">pass</text>
 <path class="ln-h" d="M400 176 L400 224 L498 224" marker-end="url(#ah)"/><text class="ts" x="392" y="210" text-anchor="end">escalate + draft</text>
 <path class="ln-h" d="M660 224 L670 224 L670 154" marker-end="url(#ah)"/>
 <text class="ts" x="330" y="30">confidence · novelty · stakes · rule check</text>
 <line class="ln" x1="400" y1="38" x2="400" y2="72" stroke-dasharray="2 3"/>
</svg>
