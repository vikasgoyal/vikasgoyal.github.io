<svg viewBox="0 0 760 270" role="img" aria-label="Input is split across three workers that run at the same time. An aggregator merges their results or tallies votes, and produces the output.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd" x="10" y="109" width="90" height="52" rx="8"/><text class="t" x="55" y="140" text-anchor="middle">Input</text>
 <rect class="nd" x="140" y="109" width="100" height="52" rx="8"/><text class="t" x="190" y="140" text-anchor="middle">Split</text>
 <rect class="nd-a" x="300" y="16" width="160" height="58" rx="8"/><text class="t" x="380" y="41" text-anchor="middle">Worker A</text><text class="ts" x="380" y="59" text-anchor="middle">security review</text>
 <rect class="nd-a" x="300" y="106" width="160" height="58" rx="8"/><text class="t" x="380" y="131" text-anchor="middle">Worker B</text><text class="ts" x="380" y="149" text-anchor="middle">style review</text>
 <rect class="nd-a" x="300" y="196" width="160" height="58" rx="8"/><text class="t" x="380" y="221" text-anchor="middle">Worker C</text><text class="ts" x="380" y="239" text-anchor="middle">test coverage</text>
 <rect class="nd" x="520" y="101" width="120" height="68" rx="8"/><text class="t" x="580" y="130" text-anchor="middle">Aggregate</text><text class="ts" x="580" y="149" text-anchor="middle">merge or vote</text>
 <rect class="nd" x="670" y="109" width="80" height="52" rx="8"/><text class="t" x="710" y="140" text-anchor="middle">Output</text>
 <line class="ln" x1="100" y1="135" x2="138" y2="135" marker-end="url(#a)"/>
 <path class="ln" d="M240 128 C 270 128, 270 45, 298 45" marker-end="url(#a)"/>
 <line class="ln" x1="240" y1="135" x2="298" y2="135" marker-end="url(#a)"/>
 <path class="ln" d="M240 142 C 270 142, 270 225, 298 225" marker-end="url(#a)"/>
 <path class="ln" d="M460 45 C 490 45, 490 125, 518 125" marker-end="url(#a)"/>
 <line class="ln" x1="460" y1="135" x2="518" y2="135" marker-end="url(#a)"/>
 <path class="ln" d="M460 225 C 490 225, 490 145, 518 145" marker-end="url(#a)"/>
 <line class="ln-a" x1="640" y1="135" x2="668" y2="135" marker-end="url(#aa)"/>
 <text class="ts" x="580" y="196" text-anchor="middle">rule: any high blocks</text>
 <text class="ts" x="580" y="212" text-anchor="middle">or 2 of 3 agree</text>
</svg>
