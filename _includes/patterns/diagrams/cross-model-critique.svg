<svg viewBox="0 0 760 270" role="img" aria-label="A task and sources go to a generator from model family A, which writes a draft. A critic from model family B reviews the draft against the sources and returns numbered issues with severity. The generator makes one refinement pass. Unresolved high-severity issues go to a person; otherwise the output ships.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="94" width="100" height="56" rx="8"/><text class="t" x="60" y="118" text-anchor="middle">Task</text><text class="ts" x="60" y="136" text-anchor="middle">+ sources</text>
 <rect class="nd-a" x="140" y="86" width="140" height="72" rx="8"/><text class="t" x="210" y="114" text-anchor="middle">Generator</text><text class="ts" x="210" y="134" text-anchor="middle">model family A</text>
 <rect class="nd-g" x="330" y="86" width="140" height="72" rx="8"/><text class="t" x="400" y="114" text-anchor="middle">Critic</text><text class="ts" x="400" y="134" text-anchor="middle">model family B</text>
 <rect class="nd" x="510" y="20" width="170" height="64" rx="8"/><text class="t" x="595" y="44" text-anchor="middle">Issue list</text><text class="ts" x="595" y="64" text-anchor="middle">numbered · severity</text>
 <rect class="nd-a" x="510" y="104" width="170" height="56" rx="8"/><text class="t" x="595" y="128" text-anchor="middle">One refinement</text><text class="ts" x="595" y="146" text-anchor="middle">fix all high issues</text>
 <rect class="nd" x="700" y="104" width="50" height="56" rx="8"/><text class="t" x="725" y="137" text-anchor="middle">Out</text>
 <rect class="nd-g" x="510" y="194" width="170" height="52" rx="8"/><text class="t" x="595" y="216" text-anchor="middle">Person</text><text class="ts" x="595" y="234" text-anchor="middle">unresolved highs</text>
 <line class="ln" x1="110" y1="122" x2="138" y2="122" marker-end="url(#a)"/>
 <line class="ln" x1="280" y1="122" x2="328" y2="122" marker-end="url(#a)"/><text class="ts" x="304" y="113" text-anchor="middle">draft</text>
 <path class="ln" d="M470 104 L490 104 L490 52 L508 52" marker-end="url(#a)"/>
 <line class="ln" x1="595" y1="84" x2="595" y2="102" marker-end="url(#a)"/>
 <line class="ln-a" x1="680" y1="132" x2="698" y2="132" marker-end="url(#aa)"/>
 <line class="ln-h" x1="595" y1="160" x2="595" y2="192" marker-end="url(#ah)"/>
 <text class="ts" x="400" y="186" text-anchor="middle">critiques, doesn't rewrite</text>
 <text class="ts" x="210" y="186" text-anchor="middle">different families →</text><text class="ts" x="210" y="200" text-anchor="middle">less correlated errors</text>
</svg>
