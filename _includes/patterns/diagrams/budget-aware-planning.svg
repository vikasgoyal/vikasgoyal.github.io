<svg viewBox="0 0 760 270" role="img" aria-label="A budget bar split across search, reading and synthesis, with a reserved share for the final answer. As the budget is used, the agent moves from explore mode to finishing mode, and always returns a result with gaps labeled.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <text class="ts" x="10" y="20">BUDGET · $2 · 5 min</text>
 <rect class="nd-a" x="10" y="30" width="370" height="40" rx="6"/><text class="ts" x="195" y="55" text-anchor="middle">search · 50%</text>
 <rect class="nd-a" x="380" y="30" width="222" height="40" rx="6"/><text class="ts" x="491" y="55" text-anchor="middle">reading · 30%</text>
 <rect class="nd-g" x="602" y="30" width="148" height="40" rx="6"/><text class="ts" x="676" y="55" text-anchor="middle">synthesis · 20%</text>
 <line class="ln" x1="565" y1="22" x2="565" y2="84" stroke-dasharray="3 3"/><text class="ts" x="565" y="98" text-anchor="middle">75% used</text>
 <rect class="nd" x="10" y="122" width="250" height="68" rx="8"/><text class="t" x="135" y="151" text-anchor="middle">Explore mode</text><text class="ts" x="135" y="170" text-anchor="middle">new sources · branches</text>
 <rect class="nd-a" x="330" y="122" width="210" height="68" rx="8"/><text class="t" x="435" y="151" text-anchor="middle">Finishing mode</text><text class="ts" x="435" y="170" text-anchor="middle">no new branches</text>
 <rect class="nd" x="600" y="122" width="150" height="68" rx="8"/><text class="t" x="675" y="151" text-anchor="middle">Result</text><text class="ts" x="675" y="170" text-anchor="middle">gaps labeled</text>
 <line class="ln" x1="260" y1="156" x2="328" y2="156" marker-end="url(#a)"/><text class="ts" x="294" y="147" text-anchor="middle">budget low</text>
 <line class="ln-a" x1="540" y1="156" x2="598" y2="156" marker-end="url(#aa)"/>
 <text class="ts" x="380" y="232" text-anchor="middle">remaining budget is visible to the agent at every step · never an empty failure</text>
</svg>
