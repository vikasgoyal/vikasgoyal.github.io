<svg viewBox="0 0 760 250" role="img" aria-label="Task goes to generator, draft goes to evaluator with rubric. Pass goes to output; revise loops back to generator with feedback; after max iterations, escalate.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="96" width="100" height="52" rx="8"/><text class="t" x="60" y="127" text-anchor="middle">Task</text>
 <rect class="nd-a" x="150" y="88" width="140" height="68" rx="8"/><text class="t" x="220" y="117" text-anchor="middle">Generator</text><text class="ts" x="220" y="136" text-anchor="middle">drafts / revises</text>
 <rect class="nd-a" x="350" y="88" width="140" height="68" rx="8"/><text class="t" x="420" y="117" text-anchor="middle">Evaluator</text><text class="ts" x="420" y="136" text-anchor="middle">scores vs rubric</text>
 <rect class="nd" x="380" y="10" width="80" height="36" rx="6"/><text class="ts" x="420" y="33" text-anchor="middle">rubric v1</text>
 <rect class="nd" x="600" y="96" width="140" height="52" rx="8"/><text class="t" x="670" y="127" text-anchor="middle">Output</text>
 <rect class="nd-g" x="600" y="186" width="140" height="52" rx="8"/><text class="t" x="670" y="210" text-anchor="middle">Escalate</text><text class="ts" x="670" y="227" text-anchor="middle">human / stronger model</text>
 <line class="ln" x1="110" y1="122" x2="148" y2="122" marker-end="url(#a)"/>
 <line class="ln" x1="290" y1="122" x2="348" y2="122" marker-end="url(#a)"/><text class="ts" x="319" y="113" text-anchor="middle">draft</text>
 <line class="ln" x1="420" y1="46" x2="420" y2="86" stroke-dasharray="2 3"/>
 <line class="ln-a" x1="490" y1="122" x2="598" y2="122" marker-end="url(#aa)"/><text class="ts" x="544" y="113" text-anchor="middle">all gates pass</text>
 <path class="ln-h" d="M420 156 L420 200 L220 200 L220 158" marker-end="url(#ah)"/><text class="ts" x="320" y="216" text-anchor="middle">revise + per-criterion feedback</text>
 <path class="ln" d="M490 145 L560 212 L598 212" marker-end="url(#a)"/><text class="ts" x="555" y="176">max iterations</text>
</svg>
