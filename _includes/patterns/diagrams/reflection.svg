<svg viewBox="0 0 760 250" role="img" aria-label="Task goes to a draft step. The same model critiques the draft against a checklist and external checks. Issues loop back for revision; when none remain, the output is returned.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="96" width="100" height="52" rx="8"/><text class="t" x="60" y="127" text-anchor="middle">Task</text>
 <rect class="nd-a" x="150" y="88" width="150" height="68" rx="8"/><text class="t" x="225" y="117" text-anchor="middle">Draft / revise</text><text class="ts" x="225" y="136" text-anchor="middle">model</text>
 <rect class="nd-a" x="360" y="88" width="150" height="68" rx="8"/><text class="t" x="435" y="117" text-anchor="middle">Critique</text><text class="ts" x="435" y="136" text-anchor="middle">same model, critic prompt</text>
 <rect class="nd" x="340" y="10" width="190" height="40" rx="6"/><text class="ts" x="435" y="35" text-anchor="middle">checklist + tests / schema / sources</text>
 <rect class="nd" x="620" y="96" width="130" height="52" rx="8"/><text class="t" x="685" y="127" text-anchor="middle">Output</text>
 <line class="ln" x1="110" y1="122" x2="148" y2="122" marker-end="url(#a)"/>
 <line class="ln" x1="300" y1="122" x2="358" y2="122" marker-end="url(#a)"/><text class="ts" x="329" y="113" text-anchor="middle">draft</text>
 <line class="ln" x1="435" y1="50" x2="435" y2="86" stroke-dasharray="2 3"/>
 <line class="ln-a" x1="510" y1="122" x2="618" y2="122" marker-end="url(#aa)"/><text class="ts" x="564" y="113" text-anchor="middle">no issues</text>
 <path class="ln-h" d="M435 156 L435 204 L225 204 L225 158" marker-end="url(#ah)"/><text class="ts" x="330" y="222" text-anchor="middle">specific issues → revise (max 2 rounds)</text>
</svg>
