<svg viewBox="0 0 760 270" role="img" aria-label="A context window at 70 percent full holds the task, decisions, old turns and bulky tool output. Compaction keeps the task and decisions verbatim, summarizes old turns, drops stale output and saves the raw history to storage. The compacted context is about 25 percent full and the agent can search the stored history later.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <text class="ts" x="125" y="18" text-anchor="middle">before · ~70% full</text>
 <rect class="nd" x="20" y="26" width="210" height="220" rx="10"/>
 <rect class="nd-a" x="34" y="38" width="182" height="26" rx="5"/><text class="ts" x="46" y="55">task + constraints</text>
 <rect class="nd-a" x="34" y="70" width="182" height="26" rx="5"/><text class="ts" x="46" y="87">key decisions</text>
 <rect class="nd-g" x="34" y="102" width="182" height="62" rx="5"/><text class="ts" x="46" y="138">old turns · tool output</text>
 <rect class="nd-g" x="34" y="170" width="182" height="62" rx="5"/><text class="ts" x="46" y="206">superseded results</text>
 <rect class="nd-a" x="290" y="102" width="150" height="68" rx="8"/><text class="t" x="365" y="131" text-anchor="middle">Compact</text><text class="ts" x="365" y="150" text-anchor="middle">at threshold</text>
 <text class="ts" x="625" y="18" text-anchor="middle">after · ~25% full</text>
 <rect class="nd" x="520" y="26" width="210" height="140" rx="10"/>
 <rect class="nd-a" x="534" y="38" width="182" height="26" rx="5"/><text class="ts" x="546" y="55">task + constraints</text>
 <rect class="nd-a" x="534" y="70" width="182" height="26" rx="5"/><text class="ts" x="546" y="87">key decisions</text>
 <rect class="nd" x="534" y="102" width="182" height="26" rx="5"/><text class="ts" x="546" y="119">1-line summaries</text>
 <text class="ts" x="625" y="150" text-anchor="middle">room to keep working</text>
 <rect class="nd" x="520" y="196" width="210" height="50" rx="8"/><text class="t" x="625" y="218" text-anchor="middle">Raw history store</text><text class="ts" x="625" y="236" text-anchor="middle">searchable later</text>
 <line class="ln" x1="230" y1="136" x2="288" y2="136" marker-end="url(#a)"/>
 <path class="ln-a" d="M440 120 L480 120 L480 96 L518 96" marker-end="url(#aa)"/><text class="ts" x="474" y="88" text-anchor="end">keep verbatim</text>
 <path class="ln" d="M440 152 L480 152 L480 221 L518 221" marker-end="url(#a)"/><text class="ts" x="474" y="190" text-anchor="end">save raw</text>
</svg>
