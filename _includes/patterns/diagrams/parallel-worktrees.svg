 <rect class="nd-a" x="170" y="20" width="220" height="60" rx="8"/><text class="t" x="280" y="44" text-anchor="middle">Agent A · lw-csv</text><text class="ts" x="280" y="64" text-anchor="middle">own branch · own DB</text>
 <rect class="nd-a" x="170" y="104" width="220" height="60" rx="8"/><text class="t" x="280" y="128" text-anchor="middle">Agent B · lw-darkmode</text><text class="ts" x="280" y="148" text-anchor="middle">own branch · own DB</text>
 <rect class="nd-a" x="170" y="188" width="220" height="60" rx="8"/><text class="t" x="280" y="212" text-anchor="middle">Agent C · lw-metrics</text><text class="ts" x="280" y="232" text-anchor="middle">own branch · own DB</text>
