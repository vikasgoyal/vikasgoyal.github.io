<svg viewBox="0 0 760 270" role="img" aria-label="A small reference app shows the team way for each recurring concern, with tests, logging and CI, and is kept green in CI. The memory file tells agents to follow it. Every agent session, whether adding an endpoint, a queue consumer or a new service, copies its structure, so reviewers can focus on logic rather than style.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd-a" x="10" y="90" width="180" height="90" rx="8"/><text class="t" x="100" y="124" text-anchor="middle">Reference app</text><text class="ts" x="100" y="146" text-anchor="middle">one path end to end</text><text class="ts" x="100" y="163" text-anchor="middle">tests · logging · CI</text>
 <rect class="nd" x="240" y="20" width="150" height="56" rx="8"/><text class="t" x="315" y="44" text-anchor="middle">Memory file</text><text class="ts" x="315" y="62" text-anchor="middle">“follow /reference”</text>
 <rect class="nd-g" x="440" y="20" width="140" height="56" rx="8"/><text class="t" x="510" y="44" text-anchor="middle">Agent session 1</text><text class="ts" x="510" y="62" text-anchor="middle">new endpoint</text>
 <rect class="nd-g" x="440" y="107" width="140" height="56" rx="8"/><text class="t" x="510" y="131" text-anchor="middle">Agent session 2</text><text class="ts" x="510" y="149" text-anchor="middle">queue consumer</text>
 <rect class="nd-g" x="440" y="194" width="140" height="56" rx="8"/><text class="t" x="510" y="218" text-anchor="middle">Agent session 3</text><text class="ts" x="510" y="236" text-anchor="middle">new service</text>
 <rect class="nd" x="630" y="107" width="120" height="56" rx="8"/><text class="t" x="690" y="131" text-anchor="middle">Review</text><text class="ts" x="690" y="149" text-anchor="middle">logic, not style</text>
 <rect class="nd" x="240" y="194" width="150" height="56" rx="8"/><text class="t" x="315" y="218" text-anchor="middle">CI</text><text class="ts" x="315" y="236" text-anchor="middle">reference stays green</text>
