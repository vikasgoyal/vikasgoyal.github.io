<svg viewBox="0 0 760 270" role="img" aria-label="A loop: the agent runs, feedback is captured from ratings, edits and outcomes, lessons are clustered, each lesson becomes a memory, prompt, skill or training change, the change passes an evaluation gate and approval, and the improved agent runs again. Every change is versioned and can be rolled back.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd-a" x="10" y="30" width="150" height="68" rx="8"/><text class="t" x="85" y="59" text-anchor="middle">Agent runs</text><text class="ts" x="85" y="78" text-anchor="middle">version N</text>
 <rect class="nd" x="220" y="30" width="170" height="68" rx="8"/><text class="t" x="305" y="59" text-anchor="middle">Capture</text><text class="ts" x="305" y="78" text-anchor="middle">ratings · edits · outcomes</text>
 <rect class="nd" x="450" y="30" width="150" height="68" rx="8"/><text class="t" x="525" y="59" text-anchor="middle">Cluster</text><text class="ts" x="525" y="78" text-anchor="middle">recurring lessons</text>
 <rect class="nd" x="450" y="166" width="300" height="80" rx="8"/><text class="t" x="600" y="190" text-anchor="middle">Change type</text><text class="ts" x="600" y="212" text-anchor="middle">personal → memory · shared → prompt or skill</text><text class="ts" x="600" y="228" text-anchor="middle">at scale → training data</text>
 <path class="nd" d="M290 150 L350 196 L290 242 L230 196 Z"/><text class="t" x="290" y="193" text-anchor="middle">Eval</text><text class="ts" x="290" y="209" text-anchor="middle">+ approve</text>
 <rect class="nd-g" x="10" y="170" width="150" height="52" rx="8"/><text class="t" x="85" y="193" text-anchor="middle">Version N+1</text><text class="ts" x="85" y="211" text-anchor="middle">rollback kept</text>
 <line class="ln" x1="160" y1="64" x2="218" y2="64" marker-end="url(#a)"/>
 <line class="ln" x1="390" y1="64" x2="448" y2="64" marker-end="url(#a)"/>
 <path class="ln" d="M600 98 L600 164" marker-end="url(#a)"/>
 <line class="ln" x1="450" y1="196" x2="352" y2="196" marker-end="url(#a)"/>
 <line class="ln-a" x1="230" y1="196" x2="162" y2="196" marker-end="url(#aa)"/><text class="ts" x="196" y="187" text-anchor="middle">pass</text>
 <line class="ln-a" x1="85" y1="170" x2="85" y2="100" marker-end="url(#aa)"/>
 <path class="ln-h" d="M290 150 L290 120 L380 120" /><text class="ts" x="388" y="124">fail → discard</text>
</svg>
