<svg viewBox="0 0 760 270" role="img" aria-label="At run time, requests go to System 1, which uses skills and escalates hard cases to System 2. System 2 solutions are logged. Offline, repeated successful cases are clustered, evaluated and promoted into new System 1 skills.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <text class="ts" x="10" y="18">RUN TIME</text>
 <rect class="nd" x="10" y="40" width="100" height="52" rx="8"/><text class="t" x="60" y="71" text-anchor="middle">Request</text>
 <rect class="nd-a" x="150" y="32" width="150" height="68" rx="8"/><text class="t" x="225" y="61" text-anchor="middle">System 1</text><text class="ts" x="225" y="80" text-anchor="middle">uses skills</text>
 <rect class="nd-g" x="380" y="32" width="150" height="68" rx="8"/><text class="t" x="455" y="61" text-anchor="middle">System 2</text><text class="ts" x="455" y="80" text-anchor="middle">hard cases</text>
 <rect class="nd" x="610" y="32" width="140" height="68" rx="8"/><text class="t" x="680" y="61" text-anchor="middle">Case log</text><text class="ts" x="680" y="80" text-anchor="middle">input · steps · outcome</text>
 <text class="ts" x="10" y="148">OFFLINE</text>
 <rect class="nd" x="560" y="170" width="190" height="68" rx="8"/><text class="t" x="655" y="199" text-anchor="middle">Cluster</text><text class="ts" x="655" y="218" text-anchor="middle">repeated + successful</text>
 <path class="nd" d="M440 160 L490 204 L440 248 L390 204 Z"/><text class="t" x="440" y="201" text-anchor="middle">Eval</text><text class="ts" x="440" y="216" text-anchor="middle">gate</text>
 <rect class="nd-a" x="150" y="170" width="170" height="68" rx="8"/><text class="t" x="235" y="199" text-anchor="middle">New skill</text><text class="ts" x="235" y="218" text-anchor="middle">owner · expiry</text>
 <line class="ln" x1="110" y1="66" x2="148" y2="66" marker-end="url(#a)"/>
 <line class="ln-h" x1="300" y1="66" x2="378" y2="66" marker-end="url(#ah)"/><text class="ts" x="339" y="57" text-anchor="middle">escalate</text>
 <line class="ln" x1="530" y1="66" x2="608" y2="66" marker-end="url(#a)"/><text class="ts" x="569" y="57" text-anchor="middle">log</text>
 <line class="ln" x1="680" y1="100" x2="680" y2="168" marker-end="url(#a)"/>
 <line class="ln" x1="560" y1="204" x2="492" y2="204" marker-end="url(#a)"/>
 <line class="ln-a" x1="390" y1="204" x2="322" y2="204" marker-end="url(#aa)"/><text class="ts" x="356" y="195" text-anchor="middle">pass</text>
 <line class="ln-a" x1="225" y1="168" x2="225" y2="102" marker-end="url(#aa)"/><text class="ts" x="233" y="140">promote</text>
 <line class="ln" x1="10" y1="132" x2="750" y2="132" stroke-dasharray="2 4"/>
</svg>
