<svg viewBox="0 0 760 270" role="img" aria-label="Delivery metrics estimate the capacity that coding agents have freed. A planning decision splits it across three levers: reduce cost, reduce risk and grow capability. The split is written down with an owner and reasons, then reviewed next cycle against the metrics.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="80" width="130" height="68" rx="8"/><text class="t" x="75" y="109" text-anchor="middle">Metrics</text><text class="ts" x="75" y="128" text-anchor="middle">freed capacity</text>
 <rect class="nd-a" x="190" y="72" width="150" height="84" rx="8"/><text class="t" x="265" y="100" text-anchor="middle">Allocation</text><text class="ts" x="265" y="120" text-anchor="middle">per planning cycle</text><text class="ts" x="265" y="136" text-anchor="middle">owner + reasons</text>
 <rect class="nd" x="400" y="16" width="170" height="58" rx="8"/><text class="t" x="485" y="40" text-anchor="middle">Reduce cost</text><text class="ts" x="485" y="58" text-anchor="middle">15% · run budgets</text>
 <rect class="nd" x="400" y="86" width="170" height="58" rx="8"/><text class="t" x="485" y="110" text-anchor="middle">Reduce risk</text><text class="ts" x="485" y="128" text-anchor="middle">35% · debt · tests</text>
 <rect class="nd-a" x="400" y="156" width="170" height="58" rx="8"/><text class="t" x="485" y="180" text-anchor="middle">Grow capability</text><text class="ts" x="485" y="198" text-anchor="middle">50% · new products</text>
 <rect class="nd" x="620" y="80" width="130" height="68" rx="8"/><text class="t" x="685" y="109" text-anchor="middle">Publish</text><text class="ts" x="685" y="128" text-anchor="middle">to all teams</text>
 <line class="ln" x1="140" y1="114" x2="188" y2="114" marker-end="url(#a)"/>
 <path class="ln" d="M340 100 C 370 100, 370 45, 398 45" marker-end="url(#a)"/>
 <line class="ln" x1="340" y1="114" x2="398" y2="114" marker-end="url(#a)"/>
 <path class="ln-a" d="M340 128 C 370 128, 370 185, 398 185" marker-end="url(#aa)"/>
 <path class="ln" d="M570 45 C 600 45, 600 104, 618 106"/>
 <line class="ln" x1="570" y1="114" x2="618" y2="114" marker-end="url(#a)"/>
 <path class="ln" d="M570 185 C 600 185, 600 124, 618 122"/>
 <path class="ln-h" d="M685 148 L685 246 L75 246 L75 150" marker-end="url(#ah)"/><text class="ts" x="380" y="240" text-anchor="middle">review next cycle against the metrics</text>
</svg>
