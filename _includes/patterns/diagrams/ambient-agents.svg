<svg viewBox="0 0 760 280" role="img" aria-label="Events from email, calendar, tickets, CRM and schedules flow into a relevance filter. Most are dropped. Relevant events update memory and a ledger of commitments. A policy chooses between doing nothing, a small allowed action, adding to a daily digest, or a rare alert.">
