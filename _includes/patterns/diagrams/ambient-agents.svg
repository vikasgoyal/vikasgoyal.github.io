 <rect class="nd" x="10" y="196" width="110" height="36" rx="6"/><text class="ts" x="65" y="219" text-anchor="middle">schedules</text>
 <rect class="nd-a" x="170" y="92" width="120" height="68" rx="8"/><text class="t" x="230" y="121" text-anchor="middle">Filter</text><text class="ts" x="230" y="140" text-anchor="middle">reflexes</text>
 <rect class="nd" x="330" y="92" width="140" height="68" rx="8"/><text class="t" x="400" y="121" text-anchor="middle">Memory</text><text class="ts" x="400" y="140" text-anchor="middle">+ ledger</text>
 <path class="nd" d="M545 82 L605 126 L545 170 L485 126 Z"/><text class="t" x="545" y="130" text-anchor="middle">Policy</text>
