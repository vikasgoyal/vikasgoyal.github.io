<svg viewBox="0 0 760 270" role="img" aria-label="A long task runs in the background as a sequence of steps, with a checkpoint after each one. Progress and partial results are visible to the user. The user can pause, resume, cancel or steer. A steer takes effect at the next checkpoint, where the agent revises the remaining plan and continues.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <text class="ts" x="10" y="20">BACKGROUND TASK</text>
 <rect class="nd-a" x="10" y="34" width="110" height="52" rx="8"/><text class="t" x="65" y="58" text-anchor="middle">Step 1</text><text class="ts" x="65" y="76" text-anchor="middle">done</text>
 <rect class="nd-a" x="160" y="34" width="110" height="52" rx="8"/><text class="t" x="215" y="58" text-anchor="middle">Step 2</text><text class="ts" x="215" y="76" text-anchor="middle">done</text>
 <rect class="nd-a" x="310" y="34" width="110" height="52" rx="8"/><text class="t" x="365" y="58" text-anchor="middle">Step 3</text><text class="ts" x="365" y="76" text-anchor="middle">running</text>
 <rect class="nd" x="460" y="34" width="130" height="52" rx="8"/><text class="t" x="525" y="58" text-anchor="middle">Revised plan</text><text class="ts" x="525" y="76" text-anchor="middle">steps 4–12</text>
 <rect class="nd" x="630" y="34" width="120" height="52" rx="8"/><text class="t" x="690" y="65" text-anchor="middle">Result</text>
 <circle class="nd" cx="140" cy="60" r="7"/><circle class="nd" cx="290" cy="60" r="7"/><circle class="nd-g" cx="440" cy="60" r="7"/>
 <line class="ln" x1="120" y1="60" x2="133" y2="60"/><line class="ln" x1="147" y1="60" x2="158" y2="60" marker-end="url(#a)"/>
 <line class="ln" x1="270" y1="60" x2="283" y2="60"/><line class="ln" x1="297" y1="60" x2="308" y2="60" marker-end="url(#a)"/>
 <line class="ln" x1="420" y1="60" x2="433" y2="60"/><line class="ln" x1="447" y1="60" x2="458" y2="60" marker-end="url(#a)"/>
 <line class="ln" x1="590" y1="60" x2="628" y2="60" marker-end="url(#a)"/>
 <text class="ts" x="290" y="108" text-anchor="middle">● = checkpoint (saved state)</text>
 <rect class="nd" x="10" y="150" width="300" height="100" rx="10"/><text class="t" x="160" y="174" text-anchor="middle">User view</text><text class="ts" x="160" y="196" text-anchor="middle">plan · progress 3 of 12</text><text class="ts" x="160" y="212" text-anchor="middle">partial results · budget used</text>
 <rect class="nd-g" x="380" y="150" width="370" height="100" rx="10"/><text class="t" x="565" y="174" text-anchor="middle">Controls</text><text class="ts" x="565" y="198" text-anchor="middle">pause · resume · cancel (keeps done work)</text><text class="ts" x="565" y="216" text-anchor="middle">steer: “focus on pricing”</text>
 <line class="ln" x1="160" y1="88" x2="160" y2="148" stroke-dasharray="2 3"/>
 <path class="ln-h" d="M520 150 L520 120 L440 120 L440 70" marker-end="url(#ah)"/><text class="ts" x="528" y="134">applied at next checkpoint</text>
</svg>
