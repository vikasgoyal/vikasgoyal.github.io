<svg viewBox="0 0 760 270" role="img" aria-label="Working memory is the current context. At the end of a session a write gate decides what to store as episodic summaries or semantic facts. At the start of a task, retrieval pulls relevant items back into working memory. Users can view, edit and delete stored memory.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd-a" x="10" y="80" width="190" height="100" rx="10"/><text class="t" x="105" y="106" text-anchor="middle">Working memory</text><text class="ts" x="105" y="130" text-anchor="middle">context window</text><text class="ts" x="105" y="146" text-anchor="middle">task · turns · tool results</text><text class="ts" x="105" y="162" text-anchor="middle">this session only</text>
 <path class="nd" d="M310 80 L362 130 L310 180 L258 130 Z"/><text class="t" x="310" y="127" text-anchor="middle">Write</text><text class="ts" x="310" y="143" text-anchor="middle">gate</text>
 <rect class="nd" x="430" y="20" width="200" height="76" rx="8"/><text class="t" x="530" y="46" text-anchor="middle">Episodic</text><text class="ts" x="530" y="66" text-anchor="middle">session summaries</text><text class="ts" x="530" y="82" text-anchor="middle">outcomes · dates</text>
 <rect class="nd" x="430" y="164" width="200" height="76" rx="8"/><text class="t" x="530" y="190" text-anchor="middle">Semantic</text><text class="ts" x="530" y="210" text-anchor="middle">facts · preferences</text><text class="ts" x="530" y="226" text-anchor="middle">with source + date</text>
 <rect class="nd-g" x="660" y="96" width="90" height="68" rx="8"/><text class="t" x="705" y="125" text-anchor="middle">User</text><text class="ts" x="705" y="144" text-anchor="middle">view · delete</text>
 <line class="ln" x1="200" y1="130" x2="256" y2="130" marker-end="url(#a)"/><text class="ts" x="228" y="121" text-anchor="middle">end</text>
 <path class="ln" d="M362 130 C 396 130, 396 58, 428 58" marker-end="url(#a)"/>
 <path class="ln" d="M362 130 C 396 130, 396 202, 428 202" marker-end="url(#a)"/>
 <path class="ln-a" d="M430 40 L105 40 L105 78" marker-end="url(#aa)"/>
 <path class="ln-a" d="M430 222 L105 222 L105 182" marker-end="url(#aa)"/>
 <text class="ts" x="250" y="32" text-anchor="middle">retrieve relevant at task start</text>
 <line class="ln" x1="658" y1="120" x2="632" y2="80" stroke-dasharray="2 3"/>
 <line class="ln" x1="658" y1="140" x2="632" y2="180" stroke-dasharray="2 3"/>
 <text class="ts" x="310" y="200" text-anchor="middle">most turns: skip</text>
</svg>
