<svg viewBox="0 0 760 270" role="img" aria-label="The memory file points agents to a folder of short numbered decision records. Before changing an area, the agent reads the relevant records. If its plan fits them, it proceeds and cites the record in the pull request. If it conflicts, it stops and asks; if a person agrees the decision should change, a new record supersedes the old one, and accepted records are never edited.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="30" width="150" height="60" rx="8"/><text class="t" x="85" y="56" text-anchor="middle">Memory file</text><text class="ts" x="85" y="74" text-anchor="middle">points to records</text>
 <rect class="nd-a" x="10" y="170" width="150" height="60" rx="8"/><text class="t" x="85" y="196" text-anchor="middle">docs/decisions/</text><text class="ts" x="85" y="214" text-anchor="middle">007 · 011 · 012</text>
 <rect class="nd" x="220" y="100" width="150" height="60" rx="8"/><text class="t" x="295" y="126" text-anchor="middle">Agent plan</text><text class="ts" x="295" y="144" text-anchor="middle">reads relevant records</text>
 <rect class="nd-a" x="430" y="30" width="150" height="60" rx="8"/><text class="t" x="505" y="56" text-anchor="middle">No conflict</text><text class="ts" x="505" y="74" text-anchor="middle">cites record in PR</text>
 <rect class="nd-g" x="430" y="170" width="150" height="60" rx="8"/><text class="t" x="505" y="196" text-anchor="middle">Conflict</text><text class="ts" x="505" y="214" text-anchor="middle">stop and ask</text>
 <rect class="nd" x="620" y="170" width="130" height="60" rx="8"/><text class="t" x="685" y="196" text-anchor="middle">New record</text><text class="ts" x="685" y="214" text-anchor="middle">supersedes old</text>
 <rect class="nd-a" x="620" y="30" width="130" height="60" rx="8"/><text class="t" x="685" y="56" text-anchor="middle">Proceed</text><text class="ts" x="685" y="74" text-anchor="middle">with change</text>
 <path class="ln" d="M160 60 L190 60 L190 120 L218 120" marker-end="url(#a)"/>
 <path class="ln" d="M160 200 L190 200 L190 140 L218 140" marker-end="url(#a)"/>
 <path class="ln-a" d="M370 120 L400 120 L400 60 L428 60" marker-end="url(#aa)"/>
 <path class="ln-h" d="M370 140 L400 140 L400 200 L428 200" marker-end="url(#ah)"/>
 <path class="ln-a" d="M580 60 L618 60" marker-end="url(#aa)"/>
 <path class="ln" d="M580 200 L618 200" marker-end="url(#a)"/><text class="ts" x="599" y="162" text-anchor="middle">agreed</text>
 <path class="ln-h" d="M685 230 L685 254 L85 254 L85 232" marker-end="url(#ah)"/><text class="ts" x="385" y="248" text-anchor="middle">record kept, never edited</text>
</svg>
