<svg viewBox="0 0 760 270" role="img" aria-label="Three levels of disclosure. Level 1: one-line descriptions of all skills are always in context. Level 2: when a request matches, the skill's instructions are loaded. Level 3: detailed reference files and scripts load only if the task needs them.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd" x="10" y="104" width="100" height="52" rx="8"/><text class="t" x="60" y="135" text-anchor="middle">Request</text>
 <rect class="nd-a" x="150" y="20" width="190" height="230" rx="10"/><text class="t" x="245" y="44" text-anchor="middle">1 · Always loaded</text><text class="ts" x="245" y="62" text-anchor="middle">26 one-line descriptions</text>
 <rect class="nd" x="166" y="76" width="158" height="24" rx="4"/><text class="ts" x="176" y="92">QBR deck</text>
 <rect class="nd" x="166" y="106" width="158" height="24" rx="4"/><text class="ts" x="176" y="122">file an expense</text>
 <rect class="nd-a" x="166" y="136" width="158" height="24" rx="4"/><text class="ts" x="176" y="152">security questionnaire</text>
 <rect class="nd" x="166" y="166" width="158" height="24" rx="4"/><text class="ts" x="176" y="182">…</text>
 <text class="ts" x="245" y="236" text-anchor="middle">~1,200 tokens</text>
 <rect class="nd-a" x="390" y="100" width="170" height="90" rx="10"/><text class="t" x="475" y="126" text-anchor="middle">2 · On match</text><text class="ts" x="475" y="148" text-anchor="middle">instructions file</text><text class="ts" x="475" y="164" text-anchor="middle">procedure · rules</text>
 <rect class="nd-g" x="600" y="40" width="150" height="56" rx="8"/><text class="t" x="675" y="64" text-anchor="middle">3 · If needed</text><text class="ts" x="675" y="82" text-anchor="middle">key management ref</text>
 <rect class="nd" x="600" y="114" width="150" height="40" rx="8"/><text class="ts" x="675" y="138" text-anchor="middle">other refs · closed</text>
 <rect class="nd" x="600" y="168" width="150" height="40" rx="8"/><text class="ts" x="675" y="192" text-anchor="middle">scripts · templates</text>
 <line class="ln" x1="110" y1="130" x2="148" y2="130" marker-end="url(#a)"/>
 <line class="ln-a" x1="324" y1="148" x2="388" y2="148" marker-end="url(#aa)"/><text class="ts" x="356" y="139" text-anchor="middle">match</text>
 <path class="ln-a" d="M560 126 L580 126 L580 68 L598 68" marker-end="url(#aa)"/>
</svg>
