<svg viewBox="0 0 760 270" role="img" aria-label="A baseline of five outcome measures is recorded before agents are adopted: lead time, review wait, change failure rate, spend per change and new-work share. The same measures are tracked monthly afterwards and compared with the baseline and with non-adopting teams. The comparison drives investment decisions. Activity metrics such as lines of code and PR counts are left out.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="70" width="130" height="68" rx="8"/><text class="t" x="75" y="99" text-anchor="middle">Baseline</text><text class="ts" x="75" y="118" text-anchor="middle">before rollout</text>
 <rect class="nd" x="190" y="14" width="250" height="196" rx="10"/><text class="t" x="315" y="36" text-anchor="middle">Outcome set · read together</text>
 <rect class="nd-a" x="206" y="48" width="218" height="26" rx="5"/><text class="ts" x="315" y="65" text-anchor="middle">lead time to production</text>
 <rect class="nd-a" x="206" y="80" width="218" height="26" rx="5"/><text class="ts" x="315" y="97" text-anchor="middle">review wait</text>
 <rect class="nd-a" x="206" y="112" width="218" height="26" rx="5"/><text class="ts" x="315" y="129" text-anchor="middle">change failure rate</text>
 <rect class="nd-a" x="206" y="144" width="218" height="26" rx="5"/><text class="ts" x="315" y="161" text-anchor="middle">spend per change</text>
 <rect class="nd-a" x="206" y="176" width="218" height="26" rx="5"/><text class="ts" x="315" y="193" text-anchor="middle">new-work share</text>
 <rect class="nd" x="490" y="40" width="130" height="68" rx="8"/><text class="t" x="555" y="69" text-anchor="middle">Monthly</text><text class="ts" x="555" y="88" text-anchor="middle">per team</text>
 <rect class="nd-g" x="490" y="128" width="130" height="68" rx="8"/><text class="t" x="555" y="157" text-anchor="middle">Comparison</text><text class="ts" x="555" y="176" text-anchor="middle">non-adopters</text>
 <rect class="nd-a" x="650" y="84" width="100" height="68" rx="8"/><text class="t" x="700" y="113" text-anchor="middle">Invest</text><text class="ts" x="700" y="132" text-anchor="middle">where it lags</text>
 <line class="ln" x1="140" y1="104" x2="188" y2="104" marker-end="url(#a)"/>
 <line class="ln" x1="440" y1="74" x2="488" y2="74" marker-end="url(#a)"/>
 <line class="ln" x1="440" y1="162" x2="488" y2="162" marker-end="url(#a)"/>
 <path class="ln-a" d="M620 74 C 636 74, 636 112, 648 114" marker-end="url(#aa)"/>
 <path class="ln-a" d="M620 162 C 636 162, 636 126, 648 122" marker-end="url(#aa)"/>
 <rect class="nd-g" x="190" y="226" width="250" height="32" rx="6"/><text class="ts" x="315" y="246" text-anchor="middle">left out: lines of code · PR counts</text>
</svg>
