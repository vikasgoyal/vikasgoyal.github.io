<svg viewBox="0 0 760 260" role="img" aria-label="Request goes to the model. The model either answers or emits a tool call, which the runtime validates and executes against a tool or API; the result returns to the model.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd" x="10" y="40" width="110" height="52" rx="8"/><text class="t" x="65" y="71" text-anchor="middle">Request</text>
 <rect class="nd-a" x="170" y="32" width="150" height="68" rx="8"/><text class="t" x="245" y="61" text-anchor="middle">Model</text><text class="ts" x="245" y="80" text-anchor="middle">answer or call a tool</text>
 <rect class="nd" x="620" y="40" width="130" height="52" rx="8"/><text class="t" x="685" y="71" text-anchor="middle">Answer</text>
 <rect class="nd-a" x="170" y="176" width="150" height="68" rx="8"/><text class="t" x="245" y="205" text-anchor="middle">Runtime</text><text class="ts" x="245" y="224" text-anchor="middle">validate · authorize · run</text>
 <rect class="nd" x="430" y="176" width="160" height="68" rx="8"/><text class="t" x="510" y="205" text-anchor="middle">Tool / API</text><text class="ts" x="510" y="224" text-anchor="middle">search · DB · ticketing</text>
 <line class="ln" x1="120" y1="66" x2="168" y2="66" marker-end="url(#a)"/>
 <line class="ln-a" x1="320" y1="66" x2="618" y2="66" marker-end="url(#aa)"/><text class="ts" x="470" y="57" text-anchor="middle">final answer</text>
 <line class="ln" x1="220" y1="100" x2="220" y2="174" marker-end="url(#a)"/><text class="ts" x="212" y="142" text-anchor="end">tool call (JSON)</text>
 <line class="ln" x1="320" y1="210" x2="428" y2="210" marker-end="url(#a)"/>
 <path class="ln" d="M510 176 L510 130 L272 130 L272 102" marker-end="url(#a)"/><text class="ts" x="392" y="122" text-anchor="middle">result as new message</text>
</svg>
