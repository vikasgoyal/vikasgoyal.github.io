<svg viewBox="0 0 760 270" role="img" aria-label="The user types a chat request. The agent reads the request and the current UI state, picks components from the app's catalog or emits state actions, and the app renders them with its own design system. The user edits or undoes the result.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
 </defs>
 <rect class="nd" x="10" y="40" width="130" height="52" rx="8"/><text class="t" x="75" y="62" text-anchor="middle">Chat input</text><text class="ts" x="75" y="80" text-anchor="middle">plain language</text>
 <rect class="nd-a" x="190" y="32" width="150" height="68" rx="8"/><text class="t" x="265" y="61" text-anchor="middle">Agent</text><text class="ts" x="265" y="80" text-anchor="middle">picks + fills</text>
 <rect class="nd" x="190" y="160" width="150" height="90" rx="8"/><text class="t" x="265" y="184" text-anchor="middle">Catalog</text><text class="ts" x="265" y="204" text-anchor="middle">table · chart · form</text><text class="ts" x="265" y="220" text-anchor="middle">filter · card</text><text class="ts" x="265" y="236" text-anchor="middle">+ schemas</text>
 <rect class="nd" x="420" y="20" width="330" height="230" rx="12"/><text class="t" x="440" y="46">App UI</text><text class="ts" x="730" y="46" text-anchor="end">own design system</text>
 <rect class="nd-g" x="440" y="62" width="290" height="36" rx="6"/><text class="ts" x="452" y="85">filter · region = EMEA · over budget</text>
 <rect class="nd-a" x="440" y="108" width="140" height="90" rx="6"/><text class="ts" x="510" y="157" text-anchor="middle">table · 7 rows</text>
 <rect class="nd-a" x="590" y="108" width="140" height="90" rx="6"/><text class="ts" x="660" y="157" text-anchor="middle">chart · plan vs spend</text>
 <text class="ts" x="585" y="228" text-anchor="middle">user edits · undo history</text>
 <line class="ln" x1="140" y1="66" x2="188" y2="66" marker-end="url(#a)"/>
 <line class="ln" x1="265" y1="158" x2="265" y2="102" stroke-dasharray="2 3"/>
 <line class="ln-a" x1="340" y1="66" x2="418" y2="66" marker-end="url(#aa)"/><text class="ts" x="379" y="57" text-anchor="middle">UI actions</text>
 <path class="ln" d="M420 120 L380 120 L380 90 L342 90" marker-end="url(#a)"/><text class="ts" x="386" y="138">UI state</text>
</svg>
