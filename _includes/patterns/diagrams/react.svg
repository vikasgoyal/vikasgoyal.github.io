<svg viewBox="0 0 760 260" role="img" aria-label="Question goes into a loop of Thought, Action and Observation. The observation feeds the next thought until the agent has enough to answer.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="104" width="110" height="52" rx="8"/><text class="t" x="65" y="135" text-anchor="middle">Question</text>
 <rect class="nd-a" x="170" y="96" width="150" height="68" rx="8"/><text class="t" x="245" y="125" text-anchor="middle">Thought</text><text class="ts" x="245" y="144" text-anchor="middle">what do I need next?</text>
 <rect class="nd-a" x="370" y="96" width="140" height="68" rx="8"/><text class="t" x="440" y="125" text-anchor="middle">Action</text><text class="ts" x="440" y="144" text-anchor="middle">one tool call</text>
 <rect class="nd" x="560" y="96" width="160" height="68" rx="8"/><text class="t" x="640" y="125" text-anchor="middle">Observation</text><text class="ts" x="640" y="144" text-anchor="middle">tool result</text>
 <rect class="nd" x="560" y="10" width="160" height="52" rx="8"/><text class="t" x="640" y="41" text-anchor="middle">Answer</text>
 <line class="ln" x1="120" y1="130" x2="168" y2="130" marker-end="url(#a)"/>
 <line class="ln" x1="320" y1="130" x2="368" y2="130" marker-end="url(#a)"/>
 <line class="ln" x1="510" y1="130" x2="558" y2="130" marker-end="url(#a)"/>
 <path class="ln-h" d="M640 164 L640 214 L245 214 L245 166" marker-end="url(#ah)"/><text class="ts" x="442" y="232" text-anchor="middle">append to context · repeat (step cap)</text>
 <path class="ln-a" d="M245 96 L245 36 L558 36" marker-end="url(#aa)"/><text class="ts" x="400" y="28" text-anchor="middle">enough to answer</text>
</svg>
