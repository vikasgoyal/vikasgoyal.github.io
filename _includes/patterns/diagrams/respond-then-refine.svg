<svg viewBox="0 0 760 250" role="img" aria-label="A question goes to a fast model that shows a first answer immediately. In the background, a reasoning model refines it and the refined answer appears later with a note on what changed.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd" x="10" y="54" width="100" height="52" rx="8"/><text class="t" x="60" y="85" text-anchor="middle">Question</text>
 <rect class="nd-a" x="150" y="46" width="150" height="68" rx="8"/><text class="t" x="225" y="75" text-anchor="middle">Fast model</text><text class="ts" x="225" y="94" text-anchor="middle">System 1 · ~1s</text>
 <rect class="nd" x="530" y="46" width="220" height="68" rx="8"/><text class="t" x="640" y="75" text-anchor="middle">First take</text><text class="ts" x="640" y="94" text-anchor="middle">labeled · user keeps going</text>
 <rect class="nd-g" x="300" y="164" width="170" height="68" rx="8"/><text class="t" x="385" y="193" text-anchor="middle">Reasoning model</text><text class="ts" x="385" y="212" text-anchor="middle">background · 10–60s</text>
 <rect class="nd" x="530" y="164" width="220" height="68" rx="8"/><text class="t" x="640" y="193" text-anchor="middle">Refined answer</text><text class="ts" x="640" y="212" text-anchor="middle">+ what changed and why</text>
 <line class="ln" x1="110" y1="80" x2="148" y2="80" marker-end="url(#a)"/>
 <line class="ln-a" x1="300" y1="80" x2="528" y2="80" marker-end="url(#aa)"/><text class="ts" x="414" y="71" text-anchor="middle">show immediately</text>
 <path class="ln-h" d="M225 114 L225 198 L298 198" marker-end="url(#ah)"/><text class="ts" x="233" y="150">same request + first take</text>
 <line class="ln-a" x1="470" y1="198" x2="528" y2="198" marker-end="url(#aa)"/>
 <line class="ln" x1="640" y1="162" x2="640" y2="116" stroke-dasharray="2 3"/><text class="ts" x="648" y="143">updates in place</text>
</svg>
