<svg viewBox="0 0 760 270" role="img" aria-label="The agent proposes an action. A risk policy checks it. Low-risk actions execute automatically. High-risk actions pause and send an approval card to a person, who can approve, edit or reject. Approved actions execute and every decision is logged.">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-h"/></marker>
 </defs>
 <rect class="nd-a" x="10" y="44" width="130" height="68" rx="8"/><text class="t" x="75" y="73" text-anchor="middle">Agent</text><text class="ts" x="75" y="92" text-anchor="middle">proposes action</text>
 <path class="nd" d="M250 30 L310 78 L250 126 L190 78 Z"/><text class="t" x="250" y="75" text-anchor="middle">Risk</text><text class="ts" x="250" y="91" text-anchor="middle">policy</text>
 <rect class="nd" x="600" y="52" width="150" height="52" rx="8"/><text class="t" x="675" y="83" text-anchor="middle">Execute</text>
 <rect class="nd-g" x="180" y="176" width="150" height="68" rx="8"/><text class="t" x="255" y="205" text-anchor="middle">Pause</text><text class="ts" x="255" y="224" text-anchor="middle">save state</text>
 <rect class="nd" x="380" y="168" width="170" height="84" rx="8"/><text class="t" x="465" y="192" text-anchor="middle">Approval card</text><text class="ts" x="465" y="212" text-anchor="middle">action · why · exact</text><text class="ts" x="465" y="226" text-anchor="middle">change · if rejected</text>
 <rect class="nd-a" x="600" y="176" width="150" height="68" rx="8"/><text class="t" x="675" y="205" text-anchor="middle">Person</text><text class="ts" x="675" y="224" text-anchor="middle">approve · edit · reject</text>
 <line class="ln" x1="140" y1="78" x2="188" y2="78" marker-end="url(#a)"/>
 <line class="ln-a" x1="310" y1="78" x2="598" y2="78" marker-end="url(#aa)"/><text class="ts" x="455" y="69" text-anchor="middle">low risk · auto</text>
 <line class="ln-h" x1="250" y1="126" x2="250" y2="174" marker-end="url(#ah)"/><text class="ts" x="258" y="154">high risk</text>
 <line class="ln" x1="330" y1="210" x2="378" y2="210" marker-end="url(#a)"/>
 <line class="ln" x1="550" y1="210" x2="598" y2="210" marker-end="url(#a)"/>
 <line class="ln-a" x1="675" y1="176" x2="675" y2="106" marker-end="url(#aa)"/><text class="ts" x="683" y="146">approved</text>
 <text class="ts" x="465" y="18" text-anchor="middle">every decision logged with who and when</text>
</svg>
